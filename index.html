<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Antrenman Defteri</title>
<meta name="description" content="Kişisel antrenman, beslenme ve takviye takibi.">
<meta name="theme-color" content="#E8EBED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101315" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Antrenman">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden]:not([hidden=until-found i]) { display: none !important; }

/* Layout: one phone column with a fixed bottom tab bar (Antrenman, Takviye, Vücut, Geçmiş).
   Plate colours mark session types: push = red 25 kg, pull = blue 20 kg, legs = yellow 15 kg, rest = grey.
   Plate colours are fills only; text stays ink. Green means "done" everywhere. */
:root {
  --font-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --bg: #E8EBED;
  --surface: #FFFFFF;
  --surface-2: #F1F3F4;
  --ink: #14181B;
  --ink-2: #56616A;
  --line: #D3D9DD;
  --push: #C8362D;  --on-push: #FFFFFF;
  --pull: #1E56B3;  --on-pull: #FFFFFF;
  --leg: #F0B90B;   --on-leg: #1A1500;
  --rest: #66727A;  --on-rest: #FFFFFF;
  --done: #1B8A4B;  --on-done: #FFFFFF;  --done-soft: #DCF1E4;
  --warn: #B4471B;  --warn-soft: #FBE7DC;
  --bad: #C0262D;   --bad-soft: #FDE4E4;
  --scrim: rgba(20,24,27,.45);
  --bar: #14181B;   --on-bar: #F1F3F4;
  --shadow: 0 1px 0 rgba(20,24,27,.04), 0 8px 20px -12px rgba(20,24,27,.3);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101315; --surface: #1A1E21; --surface-2: #242A2E; --ink: #ECEFF1; --ink-2: #9AA5AC; --line: #2F373C;
    --push: #E5584D; --on-push: #1A0B0A;
    --pull: #5C93F0; --on-pull: #08162E;
    --leg: #F6C62F;  --on-leg: #1A1500;
    --rest: #8E999F; --on-rest: #101315;
    --done: #3FBF78; --on-done: #07210F; --done-soft: #1B3527;
    --warn: #F08A5D; --warn-soft: #3A2218;
  --bad: #FF6B6B;  --bad-soft: #3D1A1C;
  --scrim: rgba(0,0,0,.6);
    --bad: #FF6B6B;  --bad-soft: #3D1A1C;
    --scrim: rgba(0,0,0,.6);
    --bar: #ECEFF1;  --on-bar: #101315;
    --shadow: 0 0 0 1px rgba(255,255,255,.02);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101315; --surface: #1A1E21; --surface-2: #242A2E; --ink: #ECEFF1; --ink-2: #9AA5AC; --line: #2F373C;
  --push: #E5584D; --on-push: #1A0B0A;
  --pull: #5C93F0; --on-pull: #08162E;
  --leg: #F6C62F;  --on-leg: #1A1500;
  --rest: #8E999F; --on-rest: #101315;
  --done: #3FBF78; --on-done: #07210F; --done-soft: #1B3527;
  --warn: #F08A5D; --warn-soft: #3A2218;
  --bar: #ECEFF1;  --on-bar: #101315;
  --shadow: 0 0 0 1px rgba(255,255,255,.02);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
  padding-block: 10px calc(9rem + var(--rest-h, 0px) + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button:focus-visible, summary:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.app { max-width: 34rem; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
#view, #day { display: flex; flex-direction: column; gap: 14px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; letter-spacing: .03em; line-height: 1; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--ink-2); }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-2); }
.sync[data-s="cloud"]::before { background: var(--done); }

/* section headings inside tabs */
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: .75rem; font-weight: 700; letter-spacing: .06em; color: var(--ink-2); margin: 0; }
.sec-h b { color: var(--ink); font-size: .85rem; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.page-t { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; line-height: .95; letter-spacing: .01em; }

/* this week */
.week-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; font-size: .75rem; font-weight: 700; letter-spacing: .06em; color: var(--ink-2); }
.week-h b { color: var(--ink); font-size: .85rem; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.rgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.wk { appearance: none; cursor: pointer; min-width: 0; text-align: left; display: flex; align-items: center; gap: 8px; padding: 9px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.wk .pl { flex: none; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at center, var(--surface) 0 2.5px, var(--c) 3px); }
.wk .dtx { display: grid; gap: 2px; min-width: 0; }
.wk .dtx b { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; line-height: 1; letter-spacing: .02em; }
.wk .dtx span { display: inline-flex; align-items: center; gap: 3px; font-size: .7rem; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.wk .dtx svg { width: 11px; height: 11px; color: var(--done); }
.wk.st-done .dtx span, .wk.next .dtx span { color: var(--ink); }
.wk.next .dtx span { font-weight: 700; }
.wk[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }

/* today strip on the training tab */
.strip { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.strip .sl { font-size: .72rem; font-weight: 700; letter-spacing: .06em; color: var(--ink-2); width: 100%; }
.pill { appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 99px; padding: 6px 12px 6px 8px; font-size: .85rem; font-weight: 600; min-height: 2.75rem; }
.pill .bx { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; color: transparent; }
.pill .bx svg { width: 12px; height: 12px; }
.pill[aria-pressed="true"] { background: var(--done-soft); border-color: var(--done); }
.pill[aria-pressed="true"] .bx { background: var(--done); border-color: var(--done); color: var(--on-done); }
.pill.water { padding-left: 12px; }
.pill.water b { font-variant-numeric: tabular-nums; }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; background: var(--day); color: var(--on-day); }
.hero[data-type="push"] { --day: var(--push); --on-day: var(--on-push); }
.hero[data-type="pull"] { --day: var(--pull); --on-day: var(--on-pull); }
.hero[data-type="leg"]  { --day: var(--leg);  --on-day: var(--on-leg); }
.hero[data-type="rest"] { --day: var(--rest); --on-day: var(--on-rest); }
.hero > * { position: relative; }
.hero .plate { position: absolute; right: -18px; top: -18px; width: 84px; height: 84px; opacity: .2; color: var(--on-day); }
.eyebrow { margin: 0; font-size: .75rem; font-weight: 700; letter-spacing: .08em; }
.hero h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; line-height: 1; letter-spacing: .01em; text-wrap: balance; }
.meta { margin: 0; font-size: .85rem; font-weight: 600; }
.hero-r { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.prog { display: flex; align-items: center; gap: 10px; font-size: .85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.track { position: relative; flex: 1; height: 8px; border-radius: 99px; overflow: hidden; }
.track::before { content: ""; position: absolute; inset: 0; background: var(--on-day); opacity: .28; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--on-day); border-radius: 99px; transition: width .25s; }

/* coach tip */
.tip { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; }
.tip b { font-size: .8rem; letter-spacing: .06em; }
.tip p { margin: 0; font-size: .92rem; color: var(--ink-2); line-height: 1.5; max-width: 62ch; }
.tip.warn { background: var(--warn-soft); border-color: var(--warn); }
.tip.warn b { color: var(--warn); }

/* exercise card */
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.ex-h { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 10px; align-items: start; }
.ex-n { width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.ex-n svg { width: 18px; height: 18px; }
.ex.done .ex-n { background: var(--done); border-color: var(--done); color: var(--on-done); }
.ex h3 { margin: 0; font-size: 1.02rem; line-height: 1.2; font-weight: 700; text-wrap: balance; }
.sub { margin-top: 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.tgt { font-size: .85rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.eff { font-size: .7rem; font-weight: 700; letter-spacing: .04em; border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
.last, .warm { margin: 0; font-size: .8rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.last b, .warm b { color: var(--ink); font-weight: 600; }

.sets { display: flex; flex-direction: column; gap: 6px; }
.set { position: relative; display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) 3.2rem; gap: 8px; align-items: center; padding: 6px 6px 6px 8px; border-radius: 12px; background: var(--surface-2); transition: background .15s; }
.set.done { background: var(--done-soft); }
.set .fld input { height: 3.2rem; font-size: 1.45rem; }
.set .fld input::placeholder { font-size: 1.05rem; font-weight: 400; }
.sn { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: var(--ink-2); text-align: center; }
.pr { position: absolute; left: 4px; top: -7px; font-size: .62rem; font-weight: 800; letter-spacing: .06em; background: var(--leg); color: var(--on-leg); border-radius: 99px; padding: 1px 6px; }
.parts { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.part { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
.plabel { grid-column: 1 / -1; font-size: .75rem; font-weight: 700; color: var(--ink-2); }
.fld { position: relative; display: block; min-width: 0; }
.fld input {
  width: 100%; height: 2.75rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 9px; padding: 0 3rem 0 .7rem; font: 600 1.1rem var(--font-body); font-variant-numeric: tabular-nums;
  -webkit-appearance: none; appearance: none;
}
.fld span { position: absolute; right: .65rem; top: 50%; transform: translateY(-50%); font-size: .7rem; color: var(--ink-2); pointer-events: none; }
.fld input::placeholder { color: var(--ink-2); opacity: 1; font-weight: 500; }
.fld input.auto { font-style: italic; color: var(--ink-2); text-decoration: underline dotted; text-underline-offset: 4px; }
.fld input:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.chk { appearance: none; width: 3.2rem; height: 3.2rem; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); color: var(--line); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }
.chk svg { width: 1.4rem; height: 1.4rem; }
.set.done .chk, .chk[aria-pressed="true"] { background: var(--done); border-color: var(--done); color: var(--on-done); }
.hint { margin: 0; font-size: .85rem; font-weight: 600; background: var(--done-soft); border-radius: 10px; padding: 8px 10px; }
.setbar { display: flex; gap: 6px; justify-content: flex-end; }
.mini { appearance: none; cursor: pointer; border: 1px solid var(--line); background: transparent; border-radius: 8px; min-height: 2.75rem; min-width: 2.75rem; padding: 0 12px; font-size: .8rem; font-weight: 600; color: var(--ink-2); }

/* buttons, cards */
.btn { appearance: none; border: 0; border-radius: 14px; min-height: 3.25rem; padding: 0 18px; width: 100%; font-weight: 700; font-size: 1rem; background: var(--ink); color: var(--bg); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.sm { min-height: 2.6rem; width: auto; font-size: .9rem; border-radius: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.card p { margin: 0; max-width: 62ch; }
.card .lbl, .lbl { font-size: .8rem; color: var(--ink-2); }
.card .fld { max-width: 9rem; }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.summary .sum-t { margin: 0; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--ink); }
.summary .sum-t svg { width: 20px; height: 20px; color: var(--done); }
.sum-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sum-grid.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.sum-grid div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.sum-grid b { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.sum-grid span { font-size: .75rem; color: var(--ink-2); }

/* trackers (water, protein) */
.trk { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.trk-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.trk-top b { font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.trk-top b small { font-size: 1.1rem; color: var(--ink-2); }
.trk-top span { font-size: .8rem; font-weight: 700; letter-spacing: .06em; color: var(--ink-2); }
.bar2 { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar2 i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--c, var(--pull)); transition: width .25s; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btns button { appearance: none; cursor: pointer; flex: 1 1 4rem; min-height: 2.75rem; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: .9rem; font-variant-numeric: tabular-nums; }
.btns button.minus { flex: 0 0 auto; min-width: 2.75rem; padding: 0 12px; color: var(--ink-2); background: transparent; }
.trk .note { margin: 0; font-size: .8rem; color: var(--ink-2); }

/* supplements */
.sgroup { display: grid; gap: 6px; }
.sp { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; grid-template-columns: 2.9rem minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.sp.done { background: var(--done-soft); border-color: var(--done); }
.sp-t { display: grid; gap: 2px; min-width: 0; }
.sp-t b { font-size: 1rem; }
.sp-t span { font-size: .8rem; color: var(--ink-2); }
.sp-r { display: grid; justify-items: end; gap: 4px; }
.dots { display: flex; gap: 3px; }
.dots i { width: 8px; height: 8px; border-radius: 2px; background: var(--line); }
.dots i.on { background: var(--done); }
.streak { font-size: .72rem; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.del { appearance: none; cursor: pointer; border: 1px solid var(--warn); color: var(--warn); background: transparent; border-radius: 8px; min-height: 2rem; padding: 0 10px; font-size: .8rem; font-weight: 700; }
.addf { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.addf .full { grid-column: 1 / -1; }
.tin, .sel { width: 100%; height: 2.75rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px; padding: 0 .7rem; font-size: 1rem; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; cursor: pointer; border: 1px dashed var(--ink-2); background: transparent; border-radius: 99px; padding: 5px 11px; font-size: .82rem; font-weight: 600; }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-txt { fill: var(--ink-2); font-size: 10px; font-family: var(--font-body); }
.ch-line { fill: none; stroke: var(--c, var(--pull)); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.ch-area { fill: var(--c, var(--pull)); opacity: .12; }
.ch-dot { fill: var(--c, var(--pull)); }
.ch-end { fill: var(--surface); stroke: var(--c, var(--pull)); stroke-width: 2.5; }
.empty { margin: 0; font-size: .9rem; color: var(--ink-2); background: var(--surface-2); border-radius: 10px; padding: 14px; text-align: center; }

/* history list */
details.sess { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
details.sess summary { list-style: none; cursor: pointer; padding: 12px; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
details.sess summary::-webkit-details-marker { display: none; }
details.sess .pl { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at center, var(--surface) 0 2.5px, var(--c) 3px); }
.ss-t { display: grid; gap: 1px; min-width: 0; }
.ss-t b { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; line-height: 1; letter-spacing: .02em; }
.ss-t span { font-size: .78rem; color: var(--ink-2); }
.ss-r { font-size: .8rem; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.ss-d { padding: 0 12px 12px; display: grid; gap: 6px; }
.ss-d p { margin: 0; font-size: .85rem; font-variant-numeric: tabular-nums; }
.ss-d p b { display: block; font-weight: 600; }
.ss-d p span { color: var(--ink-2); }

/* notes */
details.notes { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
details.notes summary { list-style: none; cursor: pointer; padding: 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
details.notes summary::-webkit-details-marker { display: none; }
details.notes summary::after { content: "+"; font-size: 1.3rem; line-height: 1; color: var(--ink-2); }
details.notes[open] summary::after { content: "–"; }
.notes dl { margin: 0; padding: 0 14px 14px; display: grid; gap: 12px; }
.notes dt { font-weight: 700; font-size: .9rem; }
.notes dd { margin: 2px 0 0; color: var(--ink-2); font-size: .92rem; line-height: 1.5; max-width: 62ch; }

/* rest timer, sits above the tab bar */
.rest { position: fixed; left: 0; right: 0; bottom: calc(4rem + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; z-index: 20; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 10px; }

    var line = '<button type="button" class="brief" data-act="brief" aria-expanded="' + briefOpen + '" aria-controls="brief-p"><span class="brief-t"><b>Bu hafta ' + doneN + '/' + liftN + '</b> · ' +
      (next >= 0 ? 'Öneri: ' + titleCase(PROGRAM[next].title) : 'Hafta tamam') + '</span>' + chips + '<span class="brief-c" aria-hidden="true">▾</span></button>';
    weekEl.innerHTML = line + (briefOpen ? '<div id="brief-p" class="brief-w"><div class="rgrid">' + h + '</div>' + notes.html + '</div>' : '');
  }

  function renderStrip() {
    var el = document.getElementById('strip');
    if (!el) { return; }
    var dd = daily[today], h = '<span class="sl">BUGÜN</span>';
    profile.supps.forEach(function (s) {
      var on = !!(dd && dd.s[s.id]);
      h += '<button type="button" class="pill" data-act="supp" data-sid="' + esc(s.id) + '" aria-pressed="' + on + '"><span class="bx">' + CHECK + '</span>' + esc(s.name.split(' (')[0]) + '</button>';
    });
    var w = dd ? dd.water : 0;
    h += '<button type="button" class="pill water" data-act="water" data-v="250" aria-label="250 ml su ekle">Su <b>' + liters(w) + ' / ' + liters(waterGoal()) + ' L</b> +</button>';
    el.innerHTML = h;
  }

  function warmLine(e, last) {
    if (e.bw || !last) { return ''; }
    var w = lastVal(last, 0, 0, 'w');
    if (!w || w < 20) { return ''; }
    return '<p class="warm"><b>Isınma:</b> ' + fmt(round25(w * 0.5)) + ' kg × 6 · ' + fmt(round25(w * 0.75)) + ' kg × 3</p>';
  }

  /* today's target, from the last session: add a rep, or add weight once every set hit the top of the range */
  function targetLine(e, last) {
    if (!last || !e.reps) { return ''; }
    var lo = e.reps[0], hi = e.reps[1], leg = PROGRAM[sel].type === 'leg';
    var parts = e.parts.map(function (pn, p) {
      var rs = last.map(function (s) { return s.r[p]; }).filter(function (r) { return r !== null && r !== undefined; });
      if (!rs.length) { return ''; }
      var w = 0;
      last.forEach(function (s) { if (s.w[p] && s.w[p] > w) { w = s.w[p]; } });
      var minR = Math.min.apply(null, rs);
      var pre = e.parts.length > 1 ? pn.split(' ')[0] + ' ' : '';
      function wt(x) { return x ? (e.bw ? '+' : '') + fmt(x) + ' kg × ' : ''; }
      if (minR >= hi) { return pre + wt(w + (e.bw ? 2.5 : (leg ? 5 : 2.5))) + lo + '–' + hi + ' tekrar (kilo artır)'; }
      if (minR < lo) { return pre + wt(w) + lo + '+ tekrar (önce aralığa gir)'; }
      return pre + wt(w) + (minR + 1) + '+ tekrar (geçen seferden 1 fazla)';
    }).filter(Boolean);
    return parts.length ? '<p class="goal"><b>Bugünkü hedef:</b> ' + parts.join('  |  ') + '</p>' : '';
  }
  /* no progress across the last three sessions of a lift */
  function stallLine(e, doc) {
    if (e.bw) { return ''; }
    var me = keyOf(doc.date, doc.s), pts = [];
    liveDocs().filter(function (d) { return keyOf(d.date, d.s) !== me && d.sets && d.sets[e.id]; })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; })
      .forEach(function (d) {
        var v = 0;
        d.sets[e.id].forEach(function (s) { if (s.d && s.w[0] && s.r[0]) { v = Math.max(v, e1rm(s.w[0], s.r[0])); } });
        if (v) { pts.push(v); }
      });
    if (pts.length < 3 || pts[0] > pts[2] + 0.01 || pts[1] > pts[2] + 0.01) { return ''; }
    return '<p class="goal stall"><b>3 seanstır ilerleme yok.</b> Kiloyu %10 düşür, tekrarları üst sınıra çıkar ve oradan yeniden yüklen. Uykunu ve kalorini de kontrol et.</p>';
  }
  function trainWeeks() {
    function has(a) {
      return liveDocs().some(function (d) {
        var i = idxOfSid(d.s);
        return i >= 0 && PROGRAM[i].type !== 'rest' && d.date >= a && d.date <= addDays(a, 6) && doneCount(d, PROGRAM[i]) > 0;
      });
    }
    var n = 0, ws = weekStart;
    if (!has(ws)) { ws = addDays(ws, -7); }
    while (n < 60 && has(ws)) { n++; ws = addDays(ws, -7); }
    return n;
  }
  function howHTML(e) {
    var c = CUES[e.id], note = profile.notes[e.id] || '';
    return '<details class="how"><summary>Form, alternatif ve notum</summary><div class="how-b">' +
      (c ? '<p><b>Form:</b> ' + c[0] + '</p><p><b>Alet doluysa:</b> ' + c[1] + '</p>' : '') +
      '<label class="lbl" for="note-' + e.id + '">Makine ayarım / notum</label>' +
      '<input class="tin note-in" id="note-' + e.id + '" data-ex="' + e.id + '" type="text" maxlength="80" autocomplete="off" placeholder="ör. koltuk 4, tutamaç 2" value="' + esc(note) + '">' +
      '</div></details>';
  }

  function exHTML(e, idx, doc, first) {
    var arr = setsOf(doc, e);
    var last = lastFor(e.id, doc);
    var tgt = e.sets + ' × ' + (e.reps ? (e.reps[0] + '–' + e.reps[1] + ' tekrar') : 'maksimum tekrar');
    var h = '<article class="ex" data-ex="' + e.id + '" data-n="' + (idx + 1) + '">' +
      '<div class="ex-h"><span class="ex-n">' + (idx + 1) + '</span><div><h3>' + e.name + '</h3>' +
      '<div class="sub"><span class="tgt">' + tgt + '</span>' + (e.eff ? '<span class="eff">' + e.eff + '</span>' : '') + '</div></div></div>';
    if (first) { h += warmLine(e, last); }
    if (profile.notes[e.id]) { h += '<p class="last"><b>Ayarım:</b> ' + esc(profile.notes[e.id]) + '</p>'; }
    if (last) { h += '<p class="last"><b>Geçen sefer:</b> ' + setsLine(e, last) + '</p>'; }
    h += targetLine(e, last) + stallLine(e, doc);
    h += '<div class="sets">';
    arr.forEach(function (s, j) {
      h += '<div class="set' + (s.d ? ' done' : '') + '" data-ex="' + e.id + '" data-j="' + j + '"><span class="pr" hidden>REKOR</span><span class="sn">' + (j + 1) + '</span><div class="parts">';
      e.parts.forEach(function (pn, p) {
        var lw = lastVal(last, j, p, 'w'), lr = lastVal(last, j, p, 'r');
        var who = (e.parts.length > 1 ? pn + ', ' : '') + 'set ' + (j + 1);
        h += '<div class="part">' + (e.parts.length > 1 ? '<span class="plabel">' + pn + '</span>' : '') +
          '<label class="fld"><input class="in" id="in-' + e.id + '-' + j + '-' + p + '-w" data-k="w" data-p="' + p + '" type="text" inputmode="decimal" autocomplete="off" aria-label="' + who + ' ' + (e.bw ? 'ek kilo' : 'kilo') + '" placeholder="' + (lw !== null ? fmt(lw) : '–') + '" data-ph="' + (lw !== null ? fmt(lw) : '') + '" value="' + fmt(s.w[p]) + '"' + (autoMark[autoKey(doc, e.id, j, p, 'w')] ? ' data-auto="1"' : '') + '><span>' + (e.bw ? '+kg' : 'kg') + '</span></label>' +
          '<label class="fld"><input class="in" id="in-' + e.id + '-' + j + '-' + p + '-r" data-k="r" data-p="' + p + '" type="text" inputmode="decimal" autocomplete="off" aria-label="' + who + ' tekrar" placeholder="' + (lr !== null ? fmt(lr) : (e.reps ? e.reps[0] + '–' + e.reps[1] : '–')) + '" data-ph="' + (lr !== null ? fmt(lr) : '') + '" value="' + fmt(s.r[p]) + '"' + (autoMark[autoKey(doc, e.id, j, p, 'r')] ? ' data-auto="1"' : '') + '><span>tekrar</span></label></div>';
      });
      h += '</div><button type="button" class="chk" aria-pressed="' + !!s.d + '" aria-label="Set ' + (j + 1) + ' tamamlandı">' + CHECK + '</button></div>';
      h += '<p class="cap" data-j="' + j + '" hidden></p><div class="fb" data-j="' + j + '" role="status" hidden></div>';
    });
    var added = (doc.add && doc.add[e.id]) || 0;
    h += '</div><div class="setbar">' + (added ? '<button type="button" class="mini" data-act="set-del" data-ex="' + e.id + '">Son seti sil</button>' : '') +
      '<button type="button" class="mini" data-act="set-add" data-ex="' + e.id + '">+ Set ekle</button></div><p class="hint" hidden></p>' + howHTML(e) + '</article>';
    return h;
  }

  function updateCard(card, e, doc) {
    var arr = setsOf(doc, e);
    var all = arr.every(function (s) { return s.d; });
    card.classList.toggle('done', all);
    card.querySelector('.ex-n').innerHTML = all ? CHECK : card.getAttribute('data-n');
    /* personal records: a done set whose estimated 1RM beats every earlier session */
    var rows = card.querySelectorAll('.set');
    var bests = e.parts.map(function (pn, p) { return e.bw ? 0 : bestBefore(e.id, p, doc); });
    var shown = false;
    arr.forEach(function (s, j) {
      var isPr = false;
      if (s.d && !e.bw && !shown) {
        for (var p = 0; p < e.parts.length; p++) {
          if (bests[p] > 0 && s.w[p] && s.r[p] && e1rm(s.w[p], s.r[p]) > bests[p] + 0.01) { isPr = true; }
        }
      }
      if (isPr) { shown = true; }
      var tag = rows[j] && rows[j].querySelector('.pr');
      if (tag) { tag.hidden = !isPr; }
      /* weight coaching under each finished set */
      var fb = card.querySelector('.fb[data-j="' + j + '"]');
      if (!fb) { return; }
      var adv = adviceFor(e, s, PROGRAM[sel].type === 'leg');
      if (!adv) { fb.hidden = true; fb.innerHTML = ''; return; }
      var nextJ = -1;
      for (var k = j + 1; k < arr.length; k++) { if (!arr[k].d) { nextJ = k; break; } }
      fb.className = 'fb ' + adv.kind;
      fb.innerHTML = '<span>' + adv.msg + '</span>' + ((adv.kind !== 'ok' && adv.w !== null && adv.w !== undefined && nextJ >= 0)
        ? '<button type="button" class="mini" data-act="fb-apply" data-ex="' + e.id + '" data-j="' + nextJ + '" data-p="' + adv.p + '" data-w="' + adv.w + '">Set ' + (nextJ + 1) + '’e ' + fmt(adv.w) + ' kg yaz</button>' : '');
      fb.hidden = false;
    });
    /* under the next set: last time's numbers and today's range */
    var last = lastFor(e.id, doc), nextJ0 = -1;
    for (var q = 0; q < arr.length; q++) { if (!arr[q].d) { nextJ0 = q; break; } }
    var caps = card.querySelectorAll('.cap');
    for (var ci = 0; ci < caps.length; ci++) {
      var cj = +caps[ci].getAttribute('data-j');
      if (cj !== nextJ0) { caps[ci].hidden = true; continue; }
      var prev = e.parts.map(function (pn, p) {
        var lw = lastVal(last, cj, p, 'w'), lr = lastVal(last, cj, p, 'r');
        if (lw === null && lr === null) { return ''; }
        return (e.parts.length > 1 ? pn.split(' ')[0] + ' ' : '') + (lw !== null ? (e.bw ? '+' : '') + fmt(lw) + ' kg × ' : '') + (lr !== null ? fmt(lr) : '–');
      }).filter(Boolean).join(' | ');
      var range = e.reps ? e.reps[0] + '–' + e.reps[1] + ' tekrar' : 'maksimum tekrar';
      caps[ci].innerHTML = (prev ? 'Geçen sefer <b>' + prev + '</b> · hedef <b>' + range + '</b>' : 'Hedef <b>' + range + '</b>');
      caps[ci].hidden = false;
    }
    card.querySelectorAll('input.in').forEach(function (inp) { inp.classList.toggle('auto', inp.getAttribute('data-auto') === '1'); });
    var hint = card.querySelector('.hint');
    var show = false;
    if (all && e.reps) {
      show = arr.every(function (s) {
        for (var p = 0; p < e.parts.length; p++) { if (s.r[p] === null || s.r[p] < e.reps[1]) { return false; } }
        return true;
      });
    }
    if (show) {
      var leg = PROGRAM[sel].type === 'leg';
      hint.textContent = 'Tüm setlerde ' + e.reps[1] + ' tekrara ulaştın. Gelecek sefer ' + (e.bw ? 'ek ağırlık tak.' : 'ağırlığı ' + (leg ? '5' : '2,5') + ' kg artır.');
    }
    hint.hidden = !show;
  }

  function updateProgress(doc) {
    var day = PROGRAM[sel], total = totalSets(day, doc);
    var fill = document.getElementById('fill'), lab = document.getElementById('plabel');
    if (!fill) { return; }
    var done = doneCount(doc, day);
    fill.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
    lab.textContent = done + ' / ' + total + ' set';
  }

  var NOTES = '<details class="notes"><summary>Koç notları</summary><dl>' +
    '<div><dt>Sıra ve erteleme</dt><dd>Antrenmanlar haftanın gününe bağlı değil. Bir gün aksarsa başka bir antrenmanı yap, aksayanı sonraki güne kaydır; liste kendini ayarlar. Aynı kasları çalıştıran iki antrenman arasına en az 48 saat koy. Hafta içinde yapamadığın antrenmanı ertesi haftaya sıkıştırma, yeni hafta temiz başlar.</dd></div>' +
    '<div><dt>Isınma</dt><dd>İlk ağır hareketten önce 5 dakika hafif tempo yap (eliptik, kürek ya da yürüyüş). Sonra o hareketin çalışma ağırlığının yaklaşık yarısıyla 6 tekrar, dörtte üçüyle 3 tekrar yap. Uygulama bu ağırlıkları ilk harekette yazar. Isınma setleri listedeki sete sayılmaz.</dd></div>' +
    '<div><dt>Dinlenme</dt><dd>Ana hareketlerde 2–3 dakika, izole hareketlerde 60–90 saniye, süpersette iki hareket bitince 90 saniye dinlen. Sayaç seti işaretleyince kendiliğinden başlar.</dd></div>' +
    '<div><dt>RIR ve tükeniş</dt><dd>RIR 1: seti bitirdiğinde formu bozmadan 1 tekrar daha yapabilirdin. Tükeniş: formu bozmadan bir tekrar daha yapamayacağın nokta. Sallanarak yapılan tekrarları sayma. Tükenişi makine, kablo ve izole hareketlerde ara; Smith squat ve dips’te RIR’ı koru.</dd></div>' +
    '<div><dt>İlerleme ve rekor</dt><dd>Bir hareketin tüm setlerinde aralığın üst sayısına ulaşınca bir sonraki seferde ağırlığı artır: üst vücutta 2,5 kg, bacakta 5 kg. Tekrarlar alt sayıya düşer. Bir set kilo ve tekrara göre en güçlü setin olduğunda REKOR etiketi çıkar.</dd></div>' +
    '<div><dt>Kilo girişi</dt><dd>İlk sete yazdığın kilo sonraki setlere kendiliğinden geçer. Bir sette farklı kilo kullandıysan o sete dokunup değiştir; sonraki setler o yeni kiloyu takip eder.</dd></div>' +
    '<div><dt>Barfiks, chin-up, dips</dt><dd>Kilo alanına yalnızca taktığın ek ağırlığı yaz. Vücut ağırlığıyla yapıyorsan boş bırak.</dd></div>' +
    '<div><dt>Uyku ve beslenme</dt><dd>Gelişim antrenmanda değil, dinlenirken olur. Gecede 7–9 saat uyu, Beslenme sekmesindeki protein hedefini çoğu gün tuttur.</dd></div>' +
    '</dl></details>';

  function summaryHTML(doc, day) {
    var st = docStats(doc, day);
    return '<section class="summary"><p class="sum-t">' + CHECK + 'Antrenman tamamlandı</p><div class="sum-grid four">' +
      '<div><b>' + st.sets + '</b><span>set</span></div><div><b>' + st.moves + '</b><span>hareket</span></div>' +
      '<div><b>' + Math.round(st.vol).toLocaleString('tr-TR') + '</b><span>kg hacim</span></div>' +

      '<button type="button" class="btn ghost" data-act="reopen">Yeniden aç</button></section>';
  }

  function renderDay() {

  function renderTraining() {

  }

  /* ================= tab: takviye ================= */

  /* ================= tab: beslenme ================= */
  var pickMeal = null, pickQ = '';
  function kcalGoal() {
    var bw = latestBw();
    if (!bw) { return null; }
    /* Mifflin-St Jeor with a 5-day lifting activity factor when height and age are known; a per-kg estimate otherwise */
    var base = (profile.h && profile.age) ? (10 * bw + 6.25 * profile.h - 5 * profile.age + (profile.sex === 'k' ? -161 : 5)) * 1.55 : bw * 33;
    return Math.round((base + (profile.goal === 'al' ? 300 : profile.goal === 'ver' ? -400 : 0) + (profile.kadj || 0)) / 50) * 50;
  }
  /* kg per week, from a straight line through the last three weeks of weigh-ins */
  function weightTrend() {
    var s = bwSeries().filter(function (p) { return dayDiff(today, p.x) <= 21; });
    if (s.length < 3 || dayDiff(s[s.length - 1].x, s[0].x) < 10) { return null; }
    var n = s.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
    s.forEach(function (p) { var x = -dayDiff(today, p.x); sx += x; sy += p.y; sxx += x * x; sxy += x * p.y; });
    var den = n * sxx - sx * sx;
    return den ? (n * sxy - sx * sy) / den * 7 : null;
  }
  function trendTip() {
    var t = weightTrend();
    if (t === null) { return '<aside class="tip"><b>KİLO GİDİŞATI</b><p>Son 3 haftada, aralarında en az 10 gün olan 3 tartı girince kalori hedefinin tutup tutmadığını burada söylerim.</p></aside>'; }
    var g = profile.goal, txt, adj = 0, per = (t > 0 ? '+' : '') + fmt(t) + ' kg / hafta';
    if (g === 'al') {
      if (t < 0.1) { txt = 'Kilo artmıyor. Kas yapmak için hafif fazla gerekir, günlük kaloriyi 200 artır.'; adj = 200; }
      else if (t > 0.5) { txt = 'Hızlı artıyor, fazlası yağa gider. Günlük kaloriyi 200 azalt.'; adj = -200; }
      else { txt = 'Haftada 0,1–0,5 kg artış tam hedefte. Böyle devam.'; }
    } else if (g === 'ver') {
      if (t > -0.2) { txt = 'Kilo düşmüyor. Günlük kaloriyi 200 azalt ya da adımını 2.000 artır.'; adj = -200; }
      else if (t < -1) { txt = 'Çok hızlı düşüyor, kas kaybı riski var. Günlük kaloriyi 200 artır.'; adj = 200; }
      else { txt = 'Haftada 0,2–1 kg kayıp tam hedefte. Proteini aksatma.'; }
    } else {
      if (Math.abs(t) < 0.25) { txt = 'Kilon sabit, hedef tutuyor.'; }
      else if (t > 0) { txt = 'Kilon artıyor. Korumak için günlük kaloriyi 200 azalt.'; adj = -200; }
      else { txt = 'Kilon düşüyor. Korumak için günlük kaloriyi 200 artır.'; adj = 200; }

    else if (adj) { btn = '<button type="button" class="mini" data-act="kadj" data-v="' + adj + '">Kalori hedefini ' + (adj > 0 ? '200 artır' : '200 azalt') + '</button>'; }

    if (d.note) { h += '<div class="dx"><b>Not</b><span class="skip">' + esc(d.note) + '</span></div>'; }
    h += '<div class="sheet-act"><button type="button" class="btn ghost" data-sheet="close">Kapat</button><button type="button" class="btn" data-sheet="edit" data-k="' + esc(key) + '">Düzenle</button></div>';
    return h;
  }
  function showDetail(keys) {
    keys = keys.filter(function (k) { return log[k]; });
    if (!keys.length) { return; }
    openSheet(keys.map(function (k) { return detailHTML(log[k]); }).join('<hr style="border:0;border-top:2px solid var(--line);margin:4px 0;width:100%">'), 'Antrenman detayı', {
      edit: function (b) {
        var k = b.getAttribute('data-k'), d = log[k];
        if (!d) { return; }
        editKey = k; sel = idxOfSid(d.s);
        goTab('antrenman', true);
      }
    });
  }

  function renderHistory() {
    var docs = histDocs();

    var lifts = docs.filter(function (d) { return PROGRAM[idxOfSid(d.s)].type !== 'rest'; });
    var last30 = lifts.filter(function (d) { return dayDiff(today, d.date) < 30; });
    var vol30 = last30.reduce(function (a, d) { return a + docStats(d, PROGRAM[idxOfSid(d.s)]).vol; }, 0);
    var weeks = 0, ws = weekStart;
    while (lifts.some(function (d) { return d.date >= ws && d.date <= addDays(ws, 6); })) { weeks++; ws = addDays(ws, -7); }
    if (!weeks) {
      ws = addDays(weekStart, -7);
      while (lifts.some(function (d) { return d.date >= ws && d.date <= addDays(ws, 6); })) { weeks++; ws = addDays(ws, -7); }
    }

    var h = '<h2 class="page-t">GEÇMİŞ</h2>';
    h += '<section class="sum-grid"><div><b>' + last30.length + '</b><span>antrenman · 30 gün</span></div>' +
      '<div><b>' + (vol30 >= 10000 ? fmt1(vol30 / 1000) + ' t' : Math.round(vol30).toLocaleString('tr-TR')) + '</b><span>' + (vol30 >= 10000 ? 'hacim · 30 gün' : 'kg hacim · 30 gün') + '</span></div>' +
      '<div><b>' + weeks + '</b><span>hafta üst üste</span></div></section>';

    /* last five weeks at a glance */
    var cal = '<div class="cal" aria-label="Son beş haftanın antrenman takvimi">' + ['Pt', 'Sa', 'Ça', 'Pe', 'Cu', 'Ct', 'Pa'].map(function (x) { return '<span class="ch">' + x + '</span>'; }).join('');
    for (var ci = 0; ci < 35; ci++) {
      var cd = addDays(weekStart, ci - 28);
      var dots = docs.filter(function (d) { return d.date === cd; }).map(function (d) { return '<i style="--c:var(--' + PROGRAM[idxOfSid(d.s)].type + ')"></i>'; }).join('');
      cal += dots
        ? '<button type="button" class="cd' + (cd === today ? ' now' : '') + '" data-act="hist-day" data-d="' + cd + '" aria-label="' + longDate(cd) + ' antrenmanını aç"><b>' + parseYmd(cd).getDate() + '</b><span>' + dots + '</span></button>'
        : '<span class="cd' + (cd === today ? ' now' : '') + (cd > today ? ' fut' : '') + '"><b>' + parseYmd(cd).getDate() + '</b><span></span></span>';
    }
    h += '<section class="card"><span class="lbl">Son 5 hafta · ayrıntı için güne dokun</span>' + cal + '</div>' +
      '<p class="legend"><i style="--c:var(--push)"></i>İtiş<i style="--c:var(--pull)"></i>Çekiş<i style="--c:var(--leg)"></i>Bacak<i style="--c:var(--rest)"></i>Kardiyo</p></section>';

    /* weekly sets per muscle: done so far against what the program plans */
    var doneM = MUS_NAMES.map(function () { return 0; }), planM = MUS_NAMES.map(function () { return 0; });
    SESSIONS.forEach(function (i) {
      PROGRAM[i].ex.forEach(function (e) { (MUS[e.id] || []).forEach(function (m) { planM[m[0]] += e.sets * m[1]; }); });
    });
    lifts.filter(function (d) { return d.date >= weekStart && d.date <= weekEnd; }).forEach(function (d) {
      PROGRAM[idxOfSid(d.s)].ex.forEach(function (e) {
        var n = setsOf(d, e).filter(function (s) { return s.d; }).length;
        (MUS[e.id] || []).forEach(function (m) { doneM[m[0]] += n * m[1]; });
      });
    });
    /* bar colour by muscle group: push, pull, legs; core grey. A check marks a muscle that reached its weekly plan. */
    var MUS_GROUP = ['push', 'pull', 'push', 'pull', 'push', 'leg', 'leg', 'leg', 'rest'];
    h += '<section class="card macro"><span class="lbl">Bu hafta kas başına set (yapılan / programdaki)</span>' +
      MUS_NAMES.map(function (nm, i) {
        var pct = planM[i] ? Math.min(100, Math.round(doneM[i] / planM[i] * 100)) : 0;
        return '<div class="mrow" style="--c:var(--' + (MUS_GROUP[i] || 'rest') + ')"><span>' + nm + '</span><div class="bar2"><i style="width:' + pct + '%"></i></div><em>' + (pct >= 100 ? '<b style="color:var(--done)">✓</b> ' : '') + fmt(Math.round(doneM[i] * 2) / 2) + ' / ' + fmt(Math.round(planM[i] * 2) / 2) + '</em></div>';
      }).join('') +
      '<p class="legend"><i style="--c:var(--push)"></i>İtiş<i style="--c:var(--pull)"></i>Çekiş<i style="--c:var(--leg)"></i>Bacak<i style="--c:var(--rest)"></i>Karın</p>' +
      '<p class="muted">Yardımcı çalışan kas yarım set sayılır (ör. row’da biceps). Kas gelişimi için haftada kas başına kabaca 10–20 set hedeflenir; tükenişe yakın çalıştığın için alt sınıra yakın olman normal.</p></section>';

    /* progress per exercise */
    var ex = ALL_EX.filter(function (x) { return x.key === progKey; })[0] || ALL_EX[0];
    var pts = [], best = 0, bestDate = null;
    liveDocs().slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (d) {
      if (!d.sets[ex.id]) { return; }
      var v = 0;
      d.sets[ex.id].forEach(function (s) {
        if (!s.d) { return; }
        var w = s.w[ex.p], r = s.r[ex.p];
        if (ex.bw) { if (r) { v = Math.max(v, r); } }
        else if (w && r) { v = Math.max(v, e1rm(w, r)); }
      });
      if (!v) { return; }
      if (pts.length && pts[pts.length - 1].x === d.date) { pts[pts.length - 1].y = Math.max(pts[pts.length - 1].y, v); }
      else { pts.push({ x: d.date, y: Math.round(v * 10) / 10 }); }
      if (v > best) { best = v; bestDate = d.date; }
    });
    h += '<section class="card"><label class="lbl" for="prog-sel">Hareket gelişimi</label><select class="sel" id="prog-sel">' +
      ['push', 'pull', 'leg'].map(function (t) {
        return '<optgroup label="' + { push: 'İtiş', pull: 'Çekiş', leg: 'Bacak' }[t] + '">' + ALL_EX.filter(function (x) { return x.type === t; }).map(function (x) {
          return '<option value="' + x.key + '"' + (x.key === ex.key ? ' selected' : '') + '>' + esc(x.name) + '</option>';
        }).join('') + '</optgroup>';
      }).join('') + '</select>';
    if (pts.length) {
      h += '<p class="muted">' + (ex.bw ? 'Seanstaki en iyi tekrar sayısı.' : 'Seanstaki en güçlü setten hesaplanan tahmini 1 tekrar maksimum (kg).') + ' En iyi: <b>' + fmt1(best) + (ex.bw ? ' tekrar' : ' kg') + '</b> · ' + shortDate(bestDate) + '</p>' + lineChart(pts.slice(-40), ex.bw ? 'tekrar' : 'kg', ex.type);
    } else {
      h += '<p class="empty">Bu hareketi kaydettikçe gelişimin burada çizilir.</p>';
    }
    h += '</section>';

    /* session list */
    h += '<p class="sec-h"><span>SEANSLAR</span><b>' + docs.length + '</b></p>';
    if (!docs.length) { h += '<p class="empty">Henüz kayıtlı antrenman yok. Antrenman sekmesinde ilk setini işaretle.</p>'; }
    docs.slice(0, 30).forEach(function (d) {
      var day = PROGRAM[idxOfSid(d.s)];
      var right;
      if (day.type === 'rest') {
        right = d.cardio.m ? fmt(d.cardio.m) + ' dk' : 'yapıldı';
      } else {
        var st = docStats(d, day);
        right = st.sets + ' set<br>' + Math.round(st.vol).toLocaleString('tr-TR') + ' kg' + (st.dur ? '<br>' + st.dur + ' dk' : '');
      }
      h += '<button type="button" class="sess" data-act="hist" data-k="' + esc(keyOf(d.date, d.s)) + '"><span class="pl" style="--c:var(--' + day.type + ')"></span><span class="ss-t"><b>' + day.title + '</b><span>' + longDate(d.date) + (d.fin || day.type === 'rest' ? '' : ' · yarım') + '</span></span><span class="ss-r">' + right + '</span></button>';
    });

    /* backup */
    h += '<section class="card"><span class="lbl">Yedek</span><p class="muted">Kayıtların bu cihazda saklanıyor. Ara ara dosya olarak yedek al.</p><p class="muted">Eski uygulamadan aldığın yedeği buradan yükle.</p>' +
      '<div class="row2"><button type="button" class="btn ghost sm" data-act="export">Yedeği indir</button>' +
      '<label class="btn ghost sm" style="display:grid;place-items:center" for="import-file">Yedekten yükle</label></div>' +
      '<input class="filein" id="import-file" type="file" accept=".json,application/json"><div id="dump"></div></section>';
    view.innerHTML = h;
  }

  /* ================= render dispatcher ================= */
  function render() {
    needsRender = false;
    var btns = document.querySelectorAll('.tb');
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].getAttribute('data-tab') === tab) { btns[i].setAttribute('aria-current', 'page'); } else { btns[i].removeAttribute('aria-current'); }
    }
    if (tab === 'beslenme') { renderNutrition(); }
    else if (tab === 'takviye') { renderSupps(); }
    else if (tab === 'vucut') { renderBody(); }
    else if (tab === 'gecmis') { renderHistory(); }
    else { renderTraining(); }
  }
  function softRender() { if (editing()) { needsRender = true; } else { render(); } }
  document.addEventListener('focusout', function () {
    setTimeout(function () { if (needsRender && !editing()) { render(); } }, 0);
  });

  function goTab(t, push) {
    if (TABS.indexOf(t) < 0) { t = 'antrenman'; }
    tab = t; vd = today; pickMeal = null;
    if (t !== 'antrenman') { editKey = null; }
    closeSheet();
    if (push) { try { history.replaceState(null, '', '#' + t); } catch (e) { try { location.hash = t; } catch (e2) {} } }
    render();
    window.scrollTo(0, 0);
    if (t === 'antrenman') { revealNextSet(false); }
  }
  document.querySelector('.tabbar').addEventListener('click', function (ev) {
    var b = ev.target.closest('.tb');
    if (b) { goTab(b.getAttribute('data-tab'), true); }
  });
  window.addEventListener('hashchange', function () { var t = location.hash.slice(1); if (t && t !== tab) { goTab(t, false); } });

  /* ================= interaction ================= */
  function toggleSupp(id) {
    var dd = dayDoc(vd);
    if (dd.s[id]) { delete dd.s[id]; } else { dd.s[id] = true; }
    touchDaily(vd);
  }
  function addWater(v) { var dd = dayDoc(vd); dd.water = Math.max(0, dd.water + v); touchDaily(vd); }
  function addProt(v) { var dd = dayDoc(vd); dd.prot = Math.max(0, dd.prot + v); touchDaily(vd); }

  view.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'sf-name' || t.id === 'cf-name') { flagInput(t, false); return; }
    var im = t.tagName === 'INPUT' ? t.getAttribute('inputmode') : null;
    if ((im === 'decimal' || im === 'numeric') && !cleanNum(t)) { return; }
    if (t.id === 'cardio-min') { cur.cardio.m = num(t.value); touch(cur); renderWeek(); return; }
    if (t.id === 'sess-note') { cur.note = t.value.slice(0, 200); touch(cur); return; }
    if (t.classList.contains('note-in')) {
      var nid = t.getAttribute('data-ex'), nv = t.value.trim().slice(0, 80);
      if (nv) { profile.notes[nid] = nv; } else { delete profile.notes[nid]; }
      touchProfile(); return;
    }
    if (t.id === 'sleep-in' || t.id === 'steps-in') {
      var sd = dayDoc(today), sv = num(t.id === 'steps-in' ? t.value.replace(/[.,]/g, '') : t.value);
      if (t.id === 'sleep-in') { sd.sleep = sv && sv <= 16 ? sv : null; } else { sd.steps = sv ? Math.round(sv) : null; }
      touchDaily(today); scheduleBody(); return;
    }
    if (t.id === 'h-in' || t.id === 'age-in') {
      var pv = num(t.value);
      if (t.id === 'h-in') { profile.h = pv && pv >= 120 && pv <= 230 ? pv : null; } else { profile.age = pv && pv >= 12 && pv <= 90 ? Math.round(pv) : null; }
      touchProfile(); scheduleBody(); return;
    }
    if (t.id === 'food-q') { pickQ = t.value; var pl = document.getElementById('pick-list'); if (pl) { pl.innerHTML = pickListHTML(); } return; }
    if (t.id === 'bw-in' || t.id === 'waist-in') {
      var dd = dayDoc(today), v = num(t.value);
      if (t.id === 'bw-in') { dd.bw = v && v >= 30 && v <= 300 ? v : null; } else { dd.waist = v && v >= 40 && v <= 200 ? v : null; }
      touchDaily(today); scheduleBody(); return;
    }
    if (!t.classList.contains('in')) { return; }
    var set = t.closest('.set');
    var e = exById(set.getAttribute('data-ex'));
    var sj = +set.getAttribute('data-j'), sk = t.getAttribute('data-k'), sp = +t.getAttribute('data-p');
    var s = setsOf(cur, e)[sj];
    if (t.getAttribute('data-auto')) { t.removeAttribute('data-auto'); t.classList.remove('auto'); delete autoMark[autoKey(cur, e.id, sj, sp, sk)]; }
    var oldV = s[sk][sp], newV = num(t.value);
    s[sk][sp] = newV;
    if (sk === 'w') { carryWeight(e, sj, sp, oldV, newV); }
    touch(cur);
    if (s.d) { updateCard(t.closest('.ex'), e, cur); }
  });

  /* a weight typed into one set flows down to the later, unfinished sets that were empty or still held the old value;
     a set whose weight was changed by hand keeps it, and the chain continues from there */
  function carryWeight(e, j, p, oldV, newV) {
    var arr = setsOf(cur, e);
    for (var k = j + 1; k < arr.length; k++) {
      var t = arr[k];
      if (t.d) { continue; }
      if (t.w[p] !== null && t.w[p] !== oldV) { break; }
      t.w[p] = newV;
      var inp = document.getElementById('in-' + e.id + '-' + k + '-' + p + '-w');
      if (inp) { inp.value = fmt(newV); }
    }
  }

  view.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'prog-sel') { progKey = t.value; render(); return; }
    if (t.id === 'protk') { profile.protK = +t.value; touchProfile(); render(); return; }
    if (t.id === 'goal') { profile.goal = t.value; profile.kadj = 0; profile.kadjAt = ''; touchProfile(); render(); return; }
    if (t.id === 'sex') { profile.sex = t.value === 'k' ? 'k' : 'e'; touchProfile(); render(); return; }
    if (t.id === 'import-file' && t.files && t.files[0]) { importFile(t.files[0]); t.value = ''; }
  });

  view.addEventListener('submit', function (ev) {
    if (ev.target.id === 'food-form') {
      ev.preventDefault();
      var fname = document.getElementById('cf-name').value.trim().replace(/\s+/g, ' ');
      var fk = num(document.getElementById('cf-kcal').value);
      if (!fname) { flagInput(document.getElementById('cf-name'), true); document.getElementById('cf-name').focus(); toast('Yemeğin adını yaz.', true); return; }
      if (fk === null) { toast('Kaloriyi yaz. Bilmiyorsan paket üstüne ya da bir kalori sitesine bak.'); document.getElementById('cf-kcal').focus(); return; }
      profile.foods.push({ id: 'f' + Date.now().toString(36), name: fname.slice(0, 60), por: document.getElementById('cf-por').value.trim().slice(0, 40) || '1 porsiyon', kcal: fk, p: num(document.getElementById('cf-p').value) || 0, c: num(document.getElementById('cf-c').value) || 0, f: num(document.getElementById('cf-f').value) || 0 });
      touchProfile();
      if (document.activeElement) { document.activeElement.blur(); }
      render();
      toast(fname + ' yemek listene eklendi.');
      return;
    }
    if (ev.target.id !== 'supp-form') { return; }
    ev.preventDefault();
    var name = document.getElementById('sf-name').value.trim().replace(/\s+/g, ' ');
    if (!name) { flagInput(document.getElementById('sf-name'), true); document.getElementById('sf-name').focus(); toast('Takviyenin adını yaz.', true); return; }
    if (profile.supps.some(function (s) { return s.name.toLowerCase() === name.toLowerCase(); })) { toast(name + ' zaten listede.'); return; }
    profile.supps.push({ id: 'c' + Date.now().toString(36), name: name.slice(0, 60), dose: document.getElementById('sf-dose').value.trim().slice(0, 60), when: document.getElementById('sf-when').value, note: '' });
    touchProfile();
    if (document.activeElement) { document.activeElement.blur(); }
    render();
    toast(name + ' eklendi.');
  });

  view.addEventListener('click', function (ev) {
    var wk = ev.target.closest('.wk');
    if (wk) { sel = +wk.getAttribute('data-i'); editKey = null; briefOpen = false; renderDay(); renderWeek(); revealNextSet(false); return; }
    var chk = ev.target.closest('.set .chk');
    if (chk) { toggleSet(chk); return; }
    var b = ev.target.closest('[data-act]');
    if (!b) { return; }
    var act = b.getAttribute('data-act');
    if (act === 'finish') {
      var fday = PROGRAM[sel], fdn = doneCount(cur, fday), ftot = totalSets(fday, cur), fdoc = cur;
      var finishNow = function () { fdoc.fin = true; fdoc.t1 = Date.now(); touch(fdoc); stopRest(); renderDay(); renderWeek(); };
      if (fdn >= ftot) { finishNow(); }
      else {
        confirmSheet(fdn ? ftot + ' setten ' + fdn + '’' + possSuffix(fdn) + ' yapıldı. Yine de bitirelim mi?' : 'Hiç set işaretlenmedi. Yine de bitirelim mi?', 'Devam et', 'Bitir', finishNow);
      }
    }
    else if (act === 'brief') { briefOpen = !briefOpen; renderWeek(); }
    else if (act === 'edit-exit') { editKey = null; sel = startSel(); renderDay(); renderWeek(); window.scrollTo(0, 0); }
    else if (act === 'hist') { showDetail([b.getAttribute('data-k')]); }
    else if (act === 'hist-day') {
      var hd = b.getAttribute('data-d');
      showDetail(histDocs().filter(function (d) { return d.date === hd; }).map(function (d) { return keyOf(d.date, d.s); }));
    }
    else if (act === 'reopen') { cur.fin = false; touch(cur); renderDay(); renderWeek(); }
    else if (act === 'cardio') { cur.cardio.d = !cur.cardio.d; touch(cur); renderDay(); renderWeek(); }
    else if (act === 'set-add' || act === 'set-del') {
      var id = b.getAttribute('data-ex'), e = exById(id);
      var n = (cur.add[id] || 0) + (act === 'set-add' ? 1 : -1);
      n = Math.max(0, Math.min(5, n));
      if (act === 'set-del' && cur.sets[id] && cur.sets[id].length > e.sets + n) { cur.sets[id].length = e.sets + n; }
      if (n) { cur.add[id] = n; } else { delete cur.add[id]; }
      touch(cur); renderDay();
    }
    else if (act === 'supp') {
      toggleSupp(b.getAttribute('data-sid'));
      if (tab === 'antrenman') { renderStrip(); } else { render(); }
    }
    else if (act === 'water') { addWater(+b.getAttribute('data-v')); if (tab === 'antrenman') { renderStrip(); } else { render(); } }
    else if (act === 'prot') { addProt(+b.getAttribute('data-v')); render(); }
    else if (act === 'supp-edit') { suppEdit = !suppEdit; render(); }
    else if (act === 'supp-del') {
      var sid = b.getAttribute('data-sid');
      profile.supps = profile.supps.filter(function (s) { return s.id !== sid; });
      touchProfile(); render();
    }
    else if (act === 'supp-cat') {
      var c = catalogById(b.getAttribute('data-sid'));
      if (c && !profile.supps.some(function (s) { return s.id === c.id; })) { profile.supps.push(clone(c)); touchProfile(); render(); }
    }
    else if (act === 'export') { exportData(); }
    else if (act === 'fb-apply') {
      var fe = exById(b.getAttribute('data-ex')), fj = +b.getAttribute('data-j'), fp = +b.getAttribute('data-p'), fw = +b.getAttribute('data-w');
      if (!fe) { return; }
      var ns = setsOf(cur, fe)[fj];
      if (!ns) { return; }
      ns.w[fp] = fw;
      touch(cur);
      var inp = document.getElementById('in-' + fe.id + '-' + fj + '-' + fp + '-w');
      if (inp) { inp.value = fmt(fw); inp.setAttribute('data-ph', fmt(fw)); }
      toast('Set ' + (fj + 1) + ': ' + fmt(fw) + ' kg yazıldı.');
    }
    else if (act === 'pick') {
      var pm = b.getAttribute('data-m');
      pickMeal = pickMeal === pm ? null : pm; pickQ = '';
      render();
      var fq = document.getElementById('food-q');
      if (fq && window.matchMedia && window.matchMedia('(pointer: fine)').matches) { fq.focus(); }
    }
    else if (act === 'food-add') {
      var food = foodById(b.getAttribute('data-fid'));
      if (!food || !pickMeal) { return; }
      dayDoc(vd).meals.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), m: pickMeal, name: food.name, por: food.por, kcal: food.kcal, p: food.p, c: food.c, f: food.f, q: 1 });
      touchDaily(vd);
      pickMeal = null; pickQ = '';
      render();
      toast(food.name + ' eklendi.');
    }
    else if (act === 'food-q') {
      var fdd = dayDoc(vd), fid = b.getAttribute('data-id'), d = +b.getAttribute('data-d');
      fdd.meals = fdd.meals.map(function (x) { if (x.id === fid) { x.q = Math.round((x.q + d) * 2) / 2; } return x; }).filter(function (x) { return x.q >= 0.5; });
      fdd.meals.forEach(function (x) { if (x.q > 5) { x.q = 5; } });
      touchDaily(vd); render();
    }
    else if (act === 'copy-meal') {
      var cm = b.getAttribute('data-m'), y = daily[addDays(vd, -1)];
      if (!y) { return; }
      var tdd = dayDoc(vd);
      y.meals.filter(function (x) { return x.m === cm; }).forEach(function (x, i) { var c2 = clone(x); c2.id = Date.now().toString(36) + i + Math.random().toString(36).slice(2, 5); tdd.meals.push(c2); });
      touchDaily(vd); render();
    }
    else if (act === 'day') {
      var nd = addDays(vd, +b.getAttribute('data-d'));
      if (nd > today) { nd = today; }
      if (dayDiff(today, nd) > 90) { nd = addDays(today, -90); }
      vd = nd; pickMeal = null; pickQ = '';
      render();
    }
    else if (act === 'kadj') {
      profile.kadj = (profile.kadj || 0) + (+b.getAttribute('data-v'));
      profile.kadjAt = today;
      touchProfile(); render();
      toast('Kalori hedefi güncellendi: ' + (kcalGoal() || 0).toLocaleString('tr-TR') + ' kcal.');
    }
    else if (act === 'kadj-reset') { profile.kadj = 0; profile.kadjAt = ''; touchProfile(); render(); }
    else if (act === 'deload') { profile.deloadAt = today; touchProfile(); renderDay(); renderWeek(); toast('Deload haftası kaydedildi.'); }
    else if (act === 'food-del') {
      var dfid = b.getAttribute('data-fid');
      profile.foods = profile.foods.filter(function (f) { return f.id !== dfid; });
      touchProfile(); render();
    }
  });

  function toggleSet(btn) {
    var set = btn.closest('.set'), card = btn.closest('.ex');
    var e = exById(set.getAttribute('data-ex')), j = +set.getAttribute('data-j');
    var s = setsOf(cur, e)[j];
    var on = !s.d;
    var filled = [], snap = clone(setsOf(cur, e)), sdoc = cur;
    if (on) {
      var inputs = set.querySelectorAll('input.in');
      for (var i = 0; i < inputs.length; i++) {
        var inp = inputs[i];
        if (inp.value.trim() === '' && inp.getAttribute('data-ph')) {
          inp.value = inp.getAttribute('data-ph');
          s[inp.getAttribute('data-k')][+inp.getAttribute('data-p')] = num(inp.value);
          filled.push({ k: inp.getAttribute('data-k'), p: +inp.getAttribute('data-p'), v: inp.value, inp: inp });
        }
      }
      /* a set needs reps; weight may stay empty (bodyweight = no added weight) but must be a number when written */
      var badInp = null, badMsg = '';
      for (var vi = 0; vi < inputs.length; vi++) {
        var vin = inputs[vi], vk = vin.getAttribute('data-k'), vtx = vin.value.trim(), vnum = num(vtx);
        var bad = vk === 'r' ? (!numOk(vtx) || vnum === null || vnum <= 0) : !numOk(vtx);
        if (bad) {
          flagInput(vin, true);
          if (!badInp) { badInp = vin; badMsg = vk === 'r' ? (vtx === '' || vnum === 0 ? 'Tekrar sayısını yaz.' : 'Tekrar sayısı geçersiz.') : 'Kilo geçersiz. Sadece sayı yaz.'; }
        } else {
          s[vk][+vin.getAttribute('data-p')] = vnum;
        }
      }
      if (badInp) { toast(badMsg, true); touch(cur); return; }
      for (var cp = 0; cp < e.parts.length; cp++) { if (s.w[cp] !== null) { carryWeight(e, j, cp, null, s.w[cp]); } }
      if (!cur.t0) { cur.t0 = Date.now(); }
    }
    s.d = on;
    set.classList.toggle('done', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    touch(cur);
    updateCard(card, e, cur);
    updateProgress(cur);
    renderWeek();
    if (on) {
      startRest(e.rest); keepAwake();
      var pr = set.querySelector('.pr');
      if (filled.length) {
        /* quick log from last session: mark it and offer an undo */
        filled.forEach(function (f) { autoMark[autoKey(sdoc, e.id, j, f.p, f.k)] = true; f.inp.setAttribute('data-auto', '1'); f.inp.classList.add('auto'); });
        var fw = filled.filter(function (f) { return f.k === 'w'; }), fr = filled.filter(function (f) { return f.k === 'r'; });
        var what = filled.length > 2 ? 'değerler' : (fw.length && fr.length ? fw[0].v + ' kg × ' + fr[0].v + ' tekrar' : (fr.length ? fr[0].v + ' tekrar' : fw[0].v + ' kg'));
        toast('Geçen seferki ' + what + ' yazıldı', { ms: 6000, action: { label: 'Geri al', fn: function () {
          var list = sdoc.sets[e.id];
          snap.forEach(function (x, i) { list[i] = x; });
          filled.forEach(function (f) { delete autoMark[autoKey(sdoc, e.id, j, f.p, f.k)]; });
          touch(sdoc); stopRest();
          if (tab === 'antrenman' && cur === sdoc) { renderDay(); renderWeek(); }
          toast('Geri alındı.');
        } } });
      }
      else if (pr && !pr.hidden) { toast('Yeni rekor: ' + e.name, { ms: 6000 }); }
      else {
        var adv = adviceFor(e, s, PROGRAM[sel].type === 'leg');
        if (adv && adv.kind === 'up') { toast('Kilo hafif kaldı' + (adv.w !== null ? ', ' + fmt(adv.w) + ' kg’a çık.' : '.'), { ms: 6000 }); }
        else if (adv && adv.kind === 'down') { toast('Kilo ağır geldi' + (adv.w ? ', ' + fmt(adv.w) + ' kg’a düş.' : '.'), { ms: 6000 }); }
      }
      revealNextSet(true);
    }
  }

  /* keep the next unfinished set in view, above the tab bar and the rest bar */
  function revealNextSet(smooth) {
    var go = function () {
      var row = document.querySelector('#day .set:not(.done)');
      if (!row) { return; }
      var r = row.getBoundingClientRect();
      var cap = row.nextElementSibling;
      var bottom = (cap && cap.classList.contains('cap') && !cap.hidden) ? cap.getBoundingClientRect().bottom : r.bottom;
      var tb = document.querySelector('.tabbar');
      var limit = window.innerHeight - (tb ? tb.offsetHeight : 0) - (restEl.hidden ? 0 : restEl.offsetHeight) - 8;
      if (r.top >= 8 && bottom <= limit) { return; }
      var target = window.scrollY + r.top - Math.max(16, Math.min(window.innerHeight * 0.3, limit - (bottom - r.top) - 16));
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: Math.max(0, target), behavior: smooth && !reduce ? 'smooth' : 'auto' });
    };
    if (window.requestAnimationFrame) { requestAnimationFrame(go); } else { go(); }
  }

  /* ================= backup ================= */
  function exportData() {
    var out = { app: 'antrenman-defteri', v: 2, exported: new Date().toISOString(), workouts: {}, daily: {}, profile: profile };
    Object.keys(log).forEach(function (k) { if (log[k].u > 0) { out.workouts[k] = log[k]; } });
    Object.keys(daily).forEach(function (k) { if (daily[k].u > 0) { out.daily[k] = daily[k]; } });
    var text = JSON.stringify(out);
    var name = 'antrenman-yedek-' + today + '.json';
    function fallback() {
      var box = document.getElementById('dump');
      if (box) { box.innerHTML = '<p class="muted">İndirme bu görünümde açık değil. Aşağıdaki metni kopyalayıp bir .json dosyasına yapıştır.</p><textarea class="dump" id="dump-text" readonly></textarea>'; document.getElementById('dump-text').value = text; }
    }
    /* phones: open the share sheet (save to Files, Drive, WhatsApp); elsewhere download the file */
    var file = null;
    try { file = new File([text], name, { type: 'application/json' }); } catch (e) {}
    var touchDev = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    try {
      if (file && touchDev && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'Antrenman Defteri yedeği' }).then(function () { toast('Yedek hazır.'); }, function (err) {
          if (err && err.name === 'AbortError') { return; }
          download();
        });
        return;
      }
    } catch (e) {}
    download();
    function download() {
      try {
        var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
        var a = document.createElement('a');
        a.href = url; a.download = name; a.style.display = 'none';
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
        toast('Yedek indirildi.');
      } catch (e) { fallback(); }
    }
  }
  function importFile(file) {
    var r = new FileReader();
    r.onload = function () {
      var o;
      try { o = JSON.parse(String(r.result)); } catch (e) { toast('Dosya okunamadı. Bu uygulamanın yedek dosyasını seç.'); return; }
      if (!o || o.app !== 'antrenman-defteri') { toast('Bu dosya Antrenman Defteri yedeği değil.'); return; }
      var nw = 0, nd = 0;
      Object.keys(o.workouts || {}).forEach(function (k) {
        var src = o.workouts[k]; if (!src || !src.date) { return; }
        var n = normalize(src), key = keyOf(n.date, n.s);
        if (!log[key] || n.u > log[key].u) { log[key] = n; nw++; queueWrite('w', key); }
      });
      Object.keys(o.daily || {}).forEach(function (k) {
        var src = o.daily[k]; if (!src || !src.date) { return; }
        var n = normDaily(src);
        if (!daily[n.date] || n.u > daily[n.date].u) { daily[n.date] = n; nd++; queueWrite('d', n.date); }
      });
      if (o.profile && (+o.profile.u || 0) > profile.u) { profile = normProfile(o.profile); queueWrite('p', 'p'); }
      saveLocal(); saveDaily(); saveProfile();
      render();
      toast(nw + ' antrenman, ' + nd + ' gün yüklendi.');
    };
    r.readAsText(file);
  }

  /* ================= rest timer ================= */
  var restEl = document.getElementById('rest'), restTime = document.getElementById('rest-time'), restLab = document.getElementById('rest-l');
  var restEnd = 0, restInt = null, restToken = 0, audioCtx = null;
  function primeAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { return; }
      audioCtx = audioCtx || new AC();
      if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    } catch (e) {}
  }
  function beep() {
    try {
      if (!audioCtx) { return; }
      var t = audioCtx.currentTime;
      [0, 0.25].forEach(function (off) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; g.gain.value = 0.15;
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t + off); o.stop(t + off + 0.15);
      });
    } catch (e) {}
    try { if (navigator.vibrate) { navigator.vibrate([200, 100, 200]); } } catch (e) {}
  }
  function tick() {
    var left = Math.ceil((restEnd - Date.now()) / 1000);
    if (left <= 0) { endRest(); return; }
    restTime.textContent = mmss(left);
  }
  function startRest(sec) {
    primeAudio();
    restEnd = Date.now() + sec * 1000;
    restToken++;
    restLab.textContent = 'DİNLENME';
    restEl.hidden = false;
    setRestH();
    clearInterval(restInt);
    tick();
    restInt = setInterval(tick, 250);
  }
  function endRest() {
    clearInterval(restInt);
    restTime.textContent = '0:00';
    restLab.textContent = 'SIRADAKİ SET';
    beep();
    var tok = restToken;
    setTimeout(function () { if (tok === restToken) { restEl.hidden = true; setRestH(); } }, 6000);
  }
  document.getElementById('rest-add').addEventListener('click', function () {
    if (restEnd < Date.now()) { restEnd = Date.now(); }
    restEnd += 15000;
    restToken++;
    restLab.textContent = 'DİNLENME';
    clearInterval(restInt);
    tick();
    restInt = setInterval(tick, 250);
  });
  function stopRest() { clearInterval(restInt); restToken++; restEl.hidden = true; setRestH(); }
  function setRestH() { document.documentElement.style.setProperty('--rest-h', restEl.hidden ? '0px' : restEl.offsetHeight + 'px'); }
  document.getElementById('rest-skip').addEventListener('click', stopRest);

  /* ================= screen stays on while training ================= */
  var wakeLock = null, wantAwake = false;
  function keepAwake() {
    wantAwake = true;
    try {
      if (!navigator.wakeLock || wakeLock) { return; }
      navigator.wakeLock.request('screen').then(function (l) {
        wakeLock = l;
        l.addEventListener('release', function () { wakeLock = null; });
      }).catch(function () {});
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') { return; }
    if (refreshDates()) { vd = today; editKey = null; sel = startSel(); softRender(); }
    if (wantAwake) { keepAwake(); }
  });

  /* ================= account sync ================= */
  function onCloudWorkouts(snap) {
    var changed = false, seen = {}, oldest = '9999';
    snap.docs.forEach(function (d) {
      var data = d.data();
      if (!data || !data.date) { return; }
      var n = normalize(data), key = keyOf(n.date, n.s);
      if (seen[key] === undefined || n.u > seen[key]) { seen[key] = n.u; }
      if (n.date < oldest) { oldest = n.date; }
      var have = log[key];
      if (!have || n.u > have.u) { log[key] = n; changed = true; }
    });
    if (!snap.metadata.fromCache) { setSync('cloud'); }
    if (changed) {
      saveLocal();
      if (tab === 'antrenman' && editing()) { cur = findDoc(PROGRAM[sel].sid); renderWeek(); }
      else { softRender(); }
    }
    if (!onCloudWorkouts.first && !snap.metadata.fromCache) {
      onCloudWorkouts.first = true;
      Object.keys(log).forEach(function (k) {
        var l = log[k];
        if (!l.u) { return; }
        var inWindow = snap.size < 400 || l.date >= oldest;
        if (inWindow && (seen[k] === undefined || l.u > seen[k])) { flush('w', k); }
      });
    }
  }
  function onCloudDaily(snap) {
    var changed = false, seen = {};
    snap.docs.forEach(function (d) {
      var data = d.data();
      if (!data || !data.date) { return; }
      var n = normDaily(data);
      seen[n.date] = n.u;
      if (!daily[n.date] || n.u > daily[n.date].u) { daily[n.date] = n; changed = true; }
    });
    if (changed) { saveDaily(); softRender(); }
    if (!onCloudDaily.first && !snap.metadata.fromCache) {
      onCloudDaily.first = true;
      Object.keys(daily).forEach(function (k) { if (daily[k].u && (seen[k] === undefined || daily[k].u > seen[k])) { flush('d', k); } });
    }
  }
  function onCloudProfile(snap) {
    if (snap.exists) {
      var n = normProfile(snap.data());
      if (n.u > profile.u) { profile = n; saveProfile(); softRender(); return; }
    }
    if (!onCloudProfile.first && !snap.metadata.fromCache) {
      onCloudProfile.first = true;
      var remoteU = snap.exists ? (+snap.data().u || 0) : 0;
      if (profile.u > remoteU) { flush('p', 'p'); }
    }
  }
  function initCloud() {
    if (!window.claude || !window.claude.use) { return; }
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) { return null; }
      return user.id().then(function (id) {
        if (!id) { return; }
        DB = db; UID = id;
        var off = function () { setSync('local'); };
        db.collection('data/users/' + id).orderBy('date', 'desc').limit(400).onSnapshot(onCloudWorkouts, off);
        var pdoc = db.doc('data/users/' + id + '/profile');
        pdoc.onSnapshot(onCloudProfile, off);
        pdoc.collection('daily').orderBy('date', 'desc').limit(400).onSnapshot(onCloudDaily, off);
      });
    }).catch(function () {});
  }

  /* ================= start ================= */
  sel = startSel();
  var h0 = location.hash.slice(1);
  tab = TABS.indexOf(h0) >= 0 ? h0 : 'antrenman';
  render();
  if (tab === 'antrenman') { revealNextSet(false); }
  initCloud();
})();
</script>
<script>
/* Service worker: offline açılış ve otomatik güncelleme. */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  var swReloaded = false, swHadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (swReloaded || !swHadController) { return; }
    swReloaded = true;
    location.reload();
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') { reg.update().catch(function () {}); }
      });
    }).catch(function () {});
  });
}
</script>
