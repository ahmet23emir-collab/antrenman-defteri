<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Antrenman Defteri</title>
<meta name="description" content="Kişisel antrenman, beslenme ve takviye takibi.">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E12" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Antrenman">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden]:not([hidden=until-found i]) { display: none !important; }

/* Layout: one phone column with a fixed bottom tab bar (Antrenman, Takviye, Vücut, Geçmiş).
   Dark first. One accent (lime) means "done" and the primary action; water is cyan, records are gold.
   Session types (push rose, pull violet-blue, legs amber, rest grey) appear as small marks and bars, always next to the session name. */
:root {
  --font-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --bg: #0C0E12; --surface: #151922; --surface-2: #1D2230; --ink: #F3F6FA; --ink-2: #9BA6B5; --line: #2A3140;
  --accent: #C8F55A; --on-accent: #10140A;
  --push: #FF6B81; --on-push: #1F0A0E;
  --pull: #8C9CFF; --on-pull: #0B0F2A;
  --leg: #FFB547;  --on-leg: #1F1404;
  --rest: #8E98A9; --on-rest: #0C0E12;
  --done: #C8F55A; --on-done: #10140A; --done-soft: #2A3424;
  --warn: #FF9A5C; --warn-soft: #3A2618;
  --bad: #FF6B6B;  --on-bad: #2A0D0A;  --bad-soft: #3D1B1E;
  --water: #3CC8F5; --water-deep: #1479C9; --on-water: #04121A;
  --gold: #FFD25E; --on-gold: #1E1505;
  --scrim: rgba(0,0,0,.6);
  --bar: #262D3D;  --on-bar: #F3F6FA; --bar-accent: #C8F55A;
  --shadow: 0 0 0 1px rgba(255,255,255,.02);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F3F5F8; --surface: #FFFFFF; --surface-2: #EDF0F5; --ink: #10141B; --ink-2: #566172; --line: #DCE1E9;
    --accent: #4E7D00; --on-accent: #FFFFFF;
    --push: #D2344F; --on-push: #FFFFFF;
    --pull: #5B4BD1; --on-pull: #FFFFFF;
    --leg: #A86300;  --on-leg: #FFFFFF;
    --rest: #677184; --on-rest: #FFFFFF;
    --done: #4E7D00; --on-done: #FFFFFF; --done-soft: #E7F1D6;
    --warn: #B33A0A; --warn-soft: #FDEBDD;
    --bad: #C81E3A;  --on-bad: #FFFFFF;  --bad-soft: #FCE4E8;
    --water: #0874B0; --water-deep: #065A92; --on-water: #FFFFFF;
    --gold: #8F6A00; --on-gold: #FFFFFF;
    --scrim: rgba(16,20,27,.45);
    --bar: #10141B;  --on-bar: #F3F5F8; --bar-accent: #C8F55A;
    --shadow: 0 1px 0 rgba(16,20,27,.04), 0 8px 20px -12px rgba(16,20,27,.25);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F3F5F8; --surface: #FFFFFF; --surface-2: #EDF0F5; --ink: #10141B; --ink-2: #566172; --line: #DCE1E9;
  --accent: #4E7D00; --on-accent: #FFFFFF;
  --push: #D2344F; --on-push: #FFFFFF;
  --pull: #5B4BD1; --on-pull: #FFFFFF;
  --leg: #A86300;  --on-leg: #FFFFFF;
  --rest: #677184; --on-rest: #FFFFFF;
  --done: #4E7D00; --on-done: #FFFFFF; --done-soft: #E7F1D6;
  --warn: #B33A0A; --warn-soft: #FDEBDD;
  --bad: #C81E3A;  --on-bad: #FFFFFF;  --bad-soft: #FCE4E8;
  --water: #0874B0; --water-deep: #065A92; --on-water: #FFFFFF;
  --gold: #8F6A00; --on-gold: #FFFFFF;
  --scrim: rgba(16,20,27,.45);
  --bar: #10141B;  --on-bar: #F3F5F8; --bar-accent: #C8F55A;
  --shadow: 0 1px 0 rgba(16,20,27,.04), 0 8px 20px -12px rgba(16,20,27,.25);
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
  padding-block: 10px calc(9rem + var(--rest-h, 0px) + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button:focus-visible, summary:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.app { max-width: 34rem; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
#view, #day { display: flex; flex-direction: column; gap: 14px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { margin: 0; font-weight: 600; font-size: 1rem; line-height: 1.2; color: var(--ink-2); }

/* section headings inside tabs */
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: .9rem; font-weight: 600; letter-spacing: 0; color: var(--ink-2); margin: 0; }
.sec-h b { color: var(--ink); font-size: .85rem; letter-spacing: 0; font-variant-numeric: tabular-nums; }

/* this week */
.rgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.wk { appearance: none; cursor: pointer; min-width: 0; text-align: left; display: flex; align-items: center; gap: 8px; padding: 9px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.wk .pl { flex: none; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at center, var(--surface) 0 2.5px, var(--c) 3px); }
.wk .dtx { display: grid; gap: 2px; min-width: 0; }
.wk .dtx b { font-family: var(--font-display); font-weight: 800; letter-spacing: .01em; font-size: 1.1rem; line-height: 1.05; }
.wk .dtx span { display: inline-flex; align-items: center; gap: 3px; font-size: .75rem; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.wk .dtx svg { width: 11px; height: 11px; color: var(--done); }
.wk.st-done .dtx span, .wk.next .dtx span { color: var(--ink); }
.wk.next .dtx span { font-weight: 700; }
.wk[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }

/* today strip on the training tab */
.strip { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.strip .sl { font-size: .9rem; font-weight: 600; letter-spacing: 0; color: var(--ink); width: 100%; }
.pill { appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 99px; padding: 6px 12px 6px 8px; font-size: .85rem; font-weight: 600; min-height: 2.75rem; }
.pill .bx { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink-2); background: var(--surface); display: grid; place-items: center; color: transparent; }
.pill .bx svg { width: 12px; height: 12px; }
.pill[aria-pressed="true"] { background: var(--done-soft); border-color: var(--done); }
.pill[aria-pressed="true"] .bx { background: var(--done); border-color: var(--done); color: var(--on-done); }
.pill.water { padding-left: 12px; }
.pill.water b { font-variant-numeric: tabular-nums; }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); color: var(--ink); }
.hero h1::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--day); margin-right: 8px; vertical-align: 1px; }
.hero .eyebrow, .hero .meta { color: var(--ink-2); }
.hero[data-type="push"] { --day: var(--push); --on-day: var(--on-push); }
.hero[data-type="pull"] { --day: var(--pull); --on-day: var(--on-pull); }
.hero[data-type="leg"]  { --day: var(--leg);  --on-day: var(--on-leg); }
.hero[data-type="rest"] { --day: var(--rest); --on-day: var(--on-rest); }
.hero > * { position: relative; }
.eyebrow { margin: 0; font-size: .85rem; font-weight: 500; }
.hero h1 { margin: 0; font-family: var(--font-display); font-weight: 800; letter-spacing: .01em; font-size: 1.4rem; line-height: 1.05; text-wrap: balance; }
.meta { margin: 0; font-size: .85rem; font-weight: 600; }
.hero-r { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.prog { display: flex; align-items: center; gap: 10px; font-size: .85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.track { position: relative; flex: 1; height: 8px; border-radius: 99px; overflow: hidden; }
.track::before { content: ""; position: absolute; inset: 0; background: var(--surface-2); }
.fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--day); border-radius: 99px; transition: width .25s; }

/* coach tip */
.tip { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 4px; }
.tip b { font-family: var(--font-display); font-weight: 800; letter-spacing: .01em; font-size: 1.05rem; }
.tip p { margin: 0; font-size: .92rem; color: var(--ink-2); line-height: 1.5; max-width: 62ch; }
.tip.warn { background: var(--warn-soft); border-color: var(--warn); }
.tip.warn b { color: var(--warn); }

/* exercise card */
.ex { background: none; border: 0; border-radius: 0; padding: 4px 0 0; display: flex; flex-direction: column; gap: 10px; box-shadow: none; }
.ex + .ex { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 4px; }
.ex-h { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 10px; align-items: start; }
.ex-n { width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.ex-n svg { width: 18px; height: 18px; }
.ex.done .ex-n { background: var(--done); border-color: var(--done); color: var(--on-done); }
.ex h3 { margin: 0; font-size: 1.02rem; line-height: 1.2; font-weight: 700; text-wrap: balance; }
.sub { margin-top: 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.tgt { font-size: .85rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.eff { font-size: .75rem; font-weight: 600; letter-spacing: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
.last, .warm, .goal, .cap { margin: 0; font-size: .9rem; line-height: 1.4; color: var(--ink); font-variant-numeric: tabular-nums; }
.last b, .warm b, .goal b, .cap b { color: var(--ink-2); font-weight: 600; font-size: .8rem; margin-right: 4px; }

.sets { display: flex; flex-direction: column; gap: 6px; }
.set { position: relative; display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) 3.2rem; gap: 8px; align-items: center; padding: 6px 6px 6px 8px; border-radius: 12px; background: var(--surface); transition: background .15s; }
.set.done { background: var(--done-soft); }
.set .fld input { height: 3.2rem; font-size: 1.45rem; background: var(--bg); }
.set .fld input::placeholder { font-size: 1.05rem; font-weight: 400; }
.sn { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: var(--ink-2); text-align: center; }
.pr { position: absolute; left: 4px; top: -8px; font-size: .75rem; font-weight: 700; letter-spacing: 0; background: var(--gold); color: var(--on-gold); border-radius: 99px; padding: 1px 6px; }
.parts { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.part { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
.plabel { grid-column: 1 / -1; font-size: .75rem; font-weight: 700; color: var(--ink-2); }
.fld { position: relative; display: block; min-width: 0; }
.fld input {
  width: 100%; height: 2.75rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 9px; padding: 0 3rem 0 .7rem; font: 600 1.1rem var(--font-body); font-variant-numeric: tabular-nums;
  -webkit-appearance: none; appearance: none;
}
.fld span { position: absolute; right: .65rem; top: 50%; transform: translateY(-50%); font-size: .75rem; color: var(--ink-2); pointer-events: none; }
.fld input::placeholder { color: var(--ink-2); opacity: 1; font-weight: 500; }
.fld input.auto { font-style: italic; color: var(--ink-2); text-decoration: underline dotted; text-underline-offset: 4px; }
.fld input:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.chk { appearance: none; width: 3.2rem; height: 3.2rem; border-radius: 50%; border: 2px solid var(--ink-2); background: var(--surface); color: var(--line); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }
.chk svg { width: 1.4rem; height: 1.4rem; }
.set.done .chk, .chk[aria-pressed="true"] { background: var(--done); border-color: var(--done); color: var(--on-done); }
/* set ✓: the fill grows from the centre (from the prototype) */
.set .chk { position: relative; }
.set .chk .fillc { position: absolute; inset: -2px; border-radius: 50%; background: var(--done); transform: scale(0); transition: transform .36s cubic-bezier(.2,1.5,.4,1); }
.set .chk svg { position: relative; transition: transform .3s cubic-bezier(.2,1.6,.4,1); }
.set.done .chk { background: transparent; }
.set.done .chk .fillc { transform: scale(1); }
.set.done .chk svg { transform: scale(1.1); }
.set .chk .ripple { position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--done); opacity: 0; pointer-events: none; }
.set .chk.go .ripple { animation: ring-out .7s ease-out; }
@keyframes ring-out { 0% { transform: scale(.4); opacity: .8; } 100% { transform: scale(1.6); opacity: 0; } }
.hint { margin: 0; font-size: .85rem; font-weight: 600; background: var(--done-soft); border-radius: 10px; padding: 8px 10px; }
.setbar { display: flex; gap: 6px; justify-content: flex-end; }
.mini { appearance: none; cursor: pointer; border: 1px solid var(--line); background: transparent; border-radius: 8px; min-height: 2.75rem; min-width: 2.75rem; padding: 0 12px; font-size: .8rem; font-weight: 600; color: var(--ink-2); }

/* buttons, cards */
.btn { appearance: none; border: 0; border-radius: 16px; min-height: 3.25rem; padding: 0 18px; width: 100%; font-weight: 700; font-size: 1rem; background: var(--accent); color: var(--on-accent); cursor: pointer; box-shadow: 0 8px 22px -12px color-mix(in srgb, var(--accent) 60%, transparent); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.sm { min-height: 2.75rem; width: auto; font-size: .9rem; border-radius: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; gap: 12px; }
.card p { margin: 0; max-width: 62ch; }
.card .lbl, .lbl { font-size: .8rem; color: var(--ink-2); }
.card .fld { max-width: 9rem; }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; gap: 12px; }
.summary .sum-t { margin: 0; font-family: var(--font-display); font-weight: 800; letter-spacing: .01em; font-size: 1.25rem; display: flex; align-items: center; gap: 8px; color: var(--ink); }
.summary .sum-t svg { width: 20px; height: 20px; color: var(--done); }
.sum-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sum-grid.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.sum-grid div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.sum-grid b { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.sum-grid span { font-size: .75rem; color: var(--ink-2); }

/* trackers (water, protein) */
.trk { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; gap: 10px; }
.trk-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.trk-top b { font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.trk-top b small { font-size: 1.1rem; color: var(--ink-2); }
.trk-top span { font-family: var(--font-display); font-weight: 800; letter-spacing: .01em; font-size: 1.15rem; color: var(--ink); }
.bar2 { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar2 i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--c, var(--pull)); transition: width .25s; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btns button { appearance: none; cursor: pointer; flex: 1 1 4rem; min-height: 2.75rem; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: .9rem; font-variant-numeric: tabular-nums; }
.btns button.minus { flex: 0 0 auto; min-width: 2.75rem; padding: 0 12px; color: var(--ink-2); background: transparent; }
.trk .note { margin: 0; font-size: .8rem; color: var(--ink-2); }

/* supplements */
.sgroup { display: grid; gap: 6px; }
.sp { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; grid-template-columns: 2.9rem minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.sp.done { background: var(--done-soft); border-color: var(--done); }
.sp-t { display: grid; gap: 2px; min-width: 0; }
.sp-t b { font-size: 1rem; }
.sp-t span { font-size: .8rem; color: var(--ink-2); }
.sp-r { display: grid; justify-items: end; gap: 4px; }
.dots { display: flex; gap: 3px; }
.dots i { width: 8px; height: 8px; border-radius: 2px; background: var(--line); }
.dots i.on { background: var(--done); }
.streak { font-size: .75rem; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.del { appearance: none; cursor: pointer; border: 1px solid var(--warn); color: var(--warn); background: transparent; border-radius: 8px; min-height: 2.75rem; padding: 0 12px; font-size: .8rem; font-weight: 700; }
.addf { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.addf .full { grid-column: 1 / -1; }
.tin, .sel { width: 100%; height: 2.75rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px; padding: 0 .7rem; font-size: 1rem; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; cursor: pointer; border: 1px dashed var(--ink-2); background: transparent; border-radius: 99px; min-height: 2.75rem; padding: 5px 12px; font-size: .82rem; font-weight: 600; }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-txt { fill: var(--ink-2); font-size: 12px; font-family: var(--font-body); }
.ch-line { fill: none; stroke: var(--c, var(--pull)); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.ch-area { fill: var(--c, var(--pull)); opacity: .12; }
.ch-dot { fill: var(--c, var(--pull)); }
.ch-end { fill: var(--surface); stroke: var(--c, var(--pull)); stroke-width: 2.5; }
.empty { margin: 0; font-size: .9rem; color: var(--ink-2); background: var(--surface-2); border-radius: 10px; padding: 14px; text-align: center; }

/* history list */
details.sess { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
details.sess summary { list-style: none; cursor: pointer; padding: 12px; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
details.sess summary::-webkit-details-marker { display: none; }
details.sess .pl { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at center, var(--surface) 0 2.5px, var(--c) 3px); }
.ss-t { display: grid; gap: 1px; min-width: 0; }
.ss-t b { font-family: var(--font-display); font-weight: 800; letter-spacing: .01em; font-size: 1.2rem; line-height: 1.05; }
.ss-t span { font-size: .78rem; color: var(--ink-2); }
.ss-r { font-size: .8rem; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.ss-d { padding: 0 12px 12px; display: grid; gap: 6px; }

/* notes */
details.notes { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }

.notes dl { margin: 0; padding: 0 14px 14px; display: grid; gap: 12px; }
.notes dt { font-weight: 700; font-size: .9rem; }
.notes dd { margin: 2px 0 0; color: var(--ink-2); font-size: .92rem; line-height: 1.5; max-width: 62ch; }

/* rest timer, sits above the tab bar */
.rest { position: fixed; left: 0; right: 0; bottom: calc(4rem + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; z-index: 20; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 10px; }
.rest-in { pointer-events: auto; width: 100%; max-width: 34rem; background: var(--bar); color: var(--on-bar); border-radius: 16px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 10px; box-shadow: 0 12px 30px -8px rgba(0,0,0,.45); }
.rest-t { display: grid; gap: 0; flex: 1; min-width: 0; }
.rest-l { font-size: .85rem; font-weight: 600; opacity: .85; }
.rest-ring { position: relative; width: 56px; height: 56px; flex: none; }
.rest-ring svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
.rr-track { fill: none; stroke: currentColor; stroke-opacity: .2; stroke-width: 6; }
.rr-arc { fill: none; stroke: var(--bar-accent); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 169.65; stroke-dashoffset: 0; }
.rest.end .rr-arc { opacity: 0; }
/* rest over: the ring turns lime and beats twice (sound may be muted, iOS gives no haptic without a touch) */
.rest.end .rr-track { stroke: var(--bar-accent); stroke-opacity: 1; }
.rest.end .rest-ring { animation: end-beat .6s ease-in-out 2; }
@keyframes end-beat { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.18); } }
.rest-ring.pulse { animation: beat 1s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 18% { transform: scale(1.08); } 36% { transform: scale(1); } 52% { transform: scale(1.04); } }
.rest-time { font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.rb { appearance: none; border: 1.5px solid currentColor; background: transparent; color: inherit; border-radius: 10px; min-height: 2.75rem; min-width: 2.75rem; padding: 0 12px; font-weight: 700; font-size: .9rem; cursor: pointer; }

/* toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(4rem + var(--rest-h, 0px) + 10px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; align-items: center; gap: 12px; width: max-content; cursor: pointer; background: var(--bar); color: var(--on-bar); border-radius: 12px; padding: 10px 14px; font-size: .9rem; font-weight: 600; max-width: calc(100% - 32px); box-shadow: 0 12px 30px -8px rgba(0,0,0,.45); }

/* bottom tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabbar-in { max-width: 34rem; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tb { appearance: none; background: none; border: 0; position: relative; display: grid; justify-items: center; align-content: center; gap: 3px; min-height: 4rem; font-size: .75rem; min-width: 0; white-space: nowrap; letter-spacing: -.01em; font-weight: 700; color: var(--ink-2); cursor: pointer; }
.tb svg { width: 22px; height: 22px; }
.tb[aria-current="page"] { color: var(--ink); }
.tb[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 25%; right: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ink); }

.muted { color: var(--ink-2); font-size: .85rem; margin: 0; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.row2 .fld { max-width: none; }
.filein { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
textarea.dump { width: 100%; min-height: 8rem; font: .75rem/1.4 ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); color: var(--ink); padding: 8px; }

/* day navigation on the daily tabs */
.dnav { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.dnav .mini { min-width: 2.75rem; min-height: 2.75rem; font-size: 1.2rem; color: var(--ink); }
.dnav .mini:disabled { opacity: .3; cursor: default; }
.dn-m { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: .85rem; color: var(--ink-2); min-width: 0; }
.dn-m b { color: var(--ink); }
.dn-m em { font-style: normal; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }

/* today's target and stall note inside an exercise card */
.goal.stall b { color: var(--warn); font-size: .9rem; }
details.how { border-top: 1px solid var(--line); margin-top: 2px; }
details.how summary { list-style: none; cursor: pointer; padding: 0; min-height: 2.75rem; align-items: center; font-size: .8rem; font-weight: 700; color: var(--ink-2); display: flex; justify-content: space-between; }
details.how summary::-webkit-details-marker { display: none; }
details.how summary::after { content: "+"; }
details.how[open] summary::after { content: "–"; }
.how-b { display: grid; gap: 8px; padding-top: 6px; }
.how-b p { margin: 0; font-size: .86rem; line-height: 1.5; color: var(--ink-2); max-width: 62ch; }
.how-b p b { color: var(--ink); }
.tip .mini { justify-self: start; color: var(--ink); border-color: var(--ink-2); margin-top: 4px; }

/* five-week calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }

.legend { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: .75rem; color: var(--ink-2); }
.legend i { margin-left: 6px; }

/* per-set coaching feedback */
.fb { margin: 0; font-size: .88rem; line-height: 1.4; border-radius: 10px; padding: 0 4px; display: grid; gap: 6px; background: none; color: var(--ink-2); }

.fb.up { background: var(--done-soft); }
.fb.down { background: var(--warn-soft); }
.fb.down b { color: var(--warn); }
.fb .mini { justify-self: start; color: var(--ink); border-color: var(--ink-2); }

/* nutrition */
.macro { display: grid; gap: 10px; }
.mrow { display: grid; grid-template-columns: 5.2rem minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .85rem; }
.mrow span:first-child { font-weight: 700; }
.mrow em { font-style: normal; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
.meal { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 8px; }
.meal-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.meal-h b { font-family: var(--font-display); font-weight: 800; letter-spacing: .01em; font-size: 1.3rem; line-height: 1.05; }
.meal-h span { font-size: .8rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.fi { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.fi-t { display: grid; gap: 1px; min-width: 0; }
.fi-t b { font-size: .92rem; font-weight: 600; }
.fi-t span { font-size: .75rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.qty { display: inline-flex; align-items: center; gap: 2px; }
.qty button { appearance: none; cursor: pointer; width: 2.75rem; height: 2.75rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; }
.qty output { min-width: 2.4rem; text-align: center; font-size: .85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.meal-a { display: flex; gap: 6px; flex-wrap: wrap; }
.pick { display: grid; gap: 6px; max-height: 22rem; overflow-y: auto; padding-right: 2px; }
.pk { appearance: none; cursor: pointer; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.pk b { font-size: .9rem; font-weight: 600; }
.pk span { font-size: .75rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pk i { font-style: normal; font-weight: 800; font-size: 1.2rem; }
.addf.five { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.addf.five .tin { padding: 0 .5rem; }

/* invalid input: red frame; .flash adds a short pulse */
.fld input[aria-invalid="true"], .tin[aria-invalid="true"] { border-color: var(--bad); box-shadow: 0 0 0 1.5px var(--bad); background: var(--bad-soft); }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0%, 60% { border-color: var(--bad); box-shadow: 0 0 0 2.5px var(--bad); background: var(--bad-soft); } }
.toast.bad { background: var(--bad); color: var(--on-bad); }

/* modal sheet: confirm dialog and history detail */
.sheet { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-in { width: 100%; max-width: 34rem; max-height: calc(100dvh - 32px - env(safe-area-inset-top, 0px)); overflow: auto; overscroll-behavior: contain; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; box-shadow: 0 20px 40px -12px rgba(0,0,0,.5); }
.sheet-in h2 { margin: 0; font-family: var(--font-display); font-weight: 800; letter-spacing: .01em; font-size: 1.6rem; line-height: 1.05; }
.sheet-in .muted { margin-top: -6px; }
.sheet-msg { margin: 0; font-size: 1rem; line-height: 1.45; }
.sheet-act { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.sheet-act .btn { min-height: 3rem; }
.dx { display: grid; gap: 4px; padding-top: 10px; border-top: 1px solid var(--line); }
.dx b { font-weight: 700; font-size: .95rem; }
.dx ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: .9rem; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.dx ol li span { display: inline-block; min-width: 1.6rem; color: var(--ink); font-weight: 600; }
.dx .skip { font-size: .85rem; color: var(--ink-2); }
button.sess { appearance: none; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
button.sess .pl { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at center, var(--surface) 0 2.5px, var(--c) 3px); }
button.cd { appearance: none; border: 0; font: inherit; color: inherit; cursor: pointer; }
button.cd:focus-visible, button.sess:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.editbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 12px; padding: 10px 12px; font-size: .88rem; font-weight: 600; }
.editbar .mini { color: var(--ink); border-color: var(--ink-2); flex: none; }

/* GÖREV 3: gym ergonomics */
button, summary, label, a, input, select, textarea, .chk { touch-action: manipulation; }
.toast-a { appearance: none; border: 1.5px solid currentColor; background: transparent; color: inherit; border-radius: 10px; min-height: 2.75rem; min-width: 2.75rem; padding: 0 12px; font: inherit; font-weight: 700; cursor: pointer; flex: none; }
.cap { margin-top: -2px; padding: 0 4px; }
.brief-w { display: grid; gap: 10px; }
.brief { appearance: none; cursor: pointer; width: 100%; min-height: 2.75rem; text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.brief-t { flex: 1 1 auto; font-size: .9rem; font-variant-numeric: tabular-nums; min-width: 0; }

.brief[aria-expanded="true"] .brief-c { transform: rotate(180deg); }
.chipw { font-size: .78rem; font-weight: 700; color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 99px; padding: 2px 8px; white-space: nowrap; }

/* GÖREV 4: empty states */
.nudge { display: grid; gap: 10px; justify-items: start; }
.nudge p { margin: 0; color: var(--ink-2); font-size: .92rem; line-height: 1.45; max-width: 46ch; }
.nudge .btn { width: auto; }
/* GÖREV 6: İlerleme */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; }
.seg button { appearance: none; cursor: pointer; min-height: 2.75rem; border: 0; border-radius: 9px; background: transparent; color: var(--ink-2); font: inherit; font-weight: 600; font-size: .92rem; }

.seg.sm { padding: 3px; flex: none; }

.prog-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pchip { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; font-weight: 600; color: var(--ink); white-space: nowrap; }

.pchip.up i { background: var(--done); }

.sum-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.sum-grid span br + * { display: block; }
.ch-lab { fill: var(--ink); font-size: 12px; font-weight: 600; font-family: var(--font-body); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
.plist { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: .9rem; font-variant-numeric: tabular-nums; }
.plist li span { display: inline-block; min-width: 3.6rem; color: var(--ink-2); }
.pxrow { appearance: none; cursor: pointer; width: 100%; min-height: 2.75rem; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; font: inherit; color: var(--ink); background: transparent; border: 0; border-top: 1px solid var(--line); padding: 8px 2px; }
.pxrow[aria-pressed="true"] .pxn b { text-decoration: underline; text-underline-offset: 3px; }
.pxn { display: grid; gap: 1px; min-width: 0; }
.pxn b { font-weight: 600; font-size: .95rem; }
.pxn span { font-size: .8rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
/* GÖREV 8a: water bottle (from the prototype) */
.wb { position: relative; overflow: hidden; }
.wb-row { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 14px; align-items: center; }
.wb-bottle { width: 140px; height: auto; display: block; overflow: visible; }
.wb-bottle .glass { fill: var(--surface-2); fill-opacity: .5; stroke: var(--ink-2); stroke-width: 2.5; }
.wb-bottle .cap { fill: var(--surface-2); stroke: var(--ink-2); stroke-width: 2; }
.wb-bottle .ridge { stroke: var(--ink-2); stroke-width: 1.5; }
.wb-bottle .tick { stroke: var(--ink-2); stroke-width: 1.5; }

.wb-bottle .shine { fill: #fff; fill-opacity: .18; }
.wb-level { transition: transform 1.1s cubic-bezier(.22,1,.36,1); }
.wb-wave { animation: wb-wave 3.2s linear infinite; }
.wb-wave.back { animation-duration: 5.4s; animation-direction: reverse; opacity: .55; }
@keyframes wb-wave { to { transform: translateX(-120px); } }
.wb-bubble { fill: #fff; fill-opacity: .55; transform-box: fill-box; transform-origin: center; animation: wb-rise 1.4s cubic-bezier(.3,.6,.5,1) forwards; }
@keyframes wb-rise { 0% { transform: translate(0, 0) scale(.4); opacity: 0; } 15% { opacity: .9; } 100% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; } }
.wb-big { font-family: var(--font-display); font-size: 2.6rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.wb-big small { font-size: 1.1rem; color: var(--ink-2); }
.wb-sub { margin: 4px 0 0; font-size: .85rem; color: var(--ink-2); }
.wb-bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
.wb-bar i { display: block; height: 100%; width: 100%; background: var(--water); border-radius: inherit; transform-origin: left; transition: transform 1.1s cubic-bezier(.22,1,.36,1); }
.wb-btns { display: grid; grid-template-columns: 2.75rem minmax(0, 1fr); gap: 8px; margin-top: 12px; }
.wb-btns button { appearance: none; cursor: pointer; min-height: 2.75rem; border-radius: 12px; font: inherit; font-weight: 700; }
.wb-minus { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-size: 1.3rem; }
.wb-plus { border: 0; background: var(--water); color: var(--on-water); }
.wb-plus:active, .wb-minus:active { transform: scale(.96); }
.wb-more { display: flex; gap: 6px; margin-top: 6px; }
.wb-more .mini { flex: 1; }

.wb-burst { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
.wb-burst i { position: absolute; width: 8px; height: 8px; border-radius: 2px; background: var(--c); opacity: 0; animation: wb-pop 1s cubic-bezier(.15,.8,.3,1) forwards; }
@keyframes wb-pop { 0% { transform: translate(0,0) rotate(0) scale(.6); opacity: 1; } 100% { transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1); opacity: 0; } }
.wb-ring { position: absolute; border-radius: 50%; border: 3px solid var(--water); pointer-events: none; opacity: 0; animation: ring-out .9s ease-out forwards; }

/* GÖREV 8a: record medal (from the prototype) */
.medal-pop { position: fixed; left: 50%; top: 40%; width: 150px; height: 170px; margin: -85px 0 0 -75px; z-index: 45; pointer-events: none; transition: opacity .35s ease; }
.medal-pop.out { opacity: 0; }

@keyframes md-pop { 0% { opacity: 0; transform: scale(.45) rotate(-14deg); } 60% { opacity: 1; transform: scale(1.1) rotate(4deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
.medal-pop .sweep { transform: translateX(-90px) skewX(-18deg); }
.medal-pop.play .sweep { animation: md-sweep .7s ease-out .22s forwards; }

.medal-pop .spark { position: absolute; left: 50%; top: 58%; width: 14px; height: 14px; margin: -7px 0 0 -7px; opacity: 0; color: var(--gold); }
.medal-pop .spark svg { width: 100%; height: 100%; display: block; }
.medal-pop.play .spark { animation: md-spark .85s cubic-bezier(.2,.8,.3,1) forwards; animation-delay: var(--d); }
@keyframes md-spark { 0% { opacity: 0; transform: translate(0,0) scale(.2) rotate(0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1) rotate(90deg); } }

/* GÖREV 8a: body map (from the prototype) */
.bm-figs { --figure: var(--surface-2); --figure-line: var(--line); --heat: var(--done); display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.bm-fig { display: grid; gap: 2px; justify-items: center; }

.wkc { gap: 12px; }

  /* ================= tab: beslenme ================= */
  var pickMeal = null, pickQ = '';
  function kcalGoal() {
    var bw = latestBw();
    if (!bw) { return null; }
    /* Mifflin-St Jeor with a 5-day lifting activity factor when height and age are known; a per-kg estimate otherwise */
    var base = (profile.h && profile.age) ? (10 * bw + 6.25 * profile.h - 5 * profile.age + (profile.sex === 'k' ? -161 : 5)) * 1.55 : bw * 33;
    return Math.round((base + (profile.goal === 'al' ? 300 : profile.goal === 'ver' ? -400 : 0) + (profile.kadj || 0)) / 50) * 50;
  }
  /* kg per week, from a straight line through the last three weeks of weigh-ins */
  function weightTrend() {
    var s = bwSeries().filter(function (p) { return dayDiff(today, p.x) <= 21; });
    if (s.length < 3 || dayDiff(s[s.length - 1].x, s[0].x) < 10) { return null; }
    var n = s.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
    s.forEach(function (p) { var x = -dayDiff(today, p.x); sx += x; sy += p.y; sxx += x * x; sxy += x * p.y; });
    var den = n * sxx - sx * sx;
    return den ? (n * sxy - sx * sy) / den * 7 : null;
  }
  function trendTip() {
    var t = weightTrend();
    if (t === null) { return '<aside class="tip"><b>Kilo gidişatı</b><p>Son 3 haftada, aralarında en az 10 gün olan 3 tartı girince kalori hedefinin tutup tutmadığını burada söylerim.</p></aside>'; }
    var g = profile.goal, txt, adj = 0, per = (t > 0 ? '+' : '') + fmt(t) + ' kg / hafta';
    if (g === 'al') {
      if (t < 0.1) { txt = 'Kilo artmıyor. Kas yapmak için hafif fazla gerekir, günlük kaloriyi 200 artır.'; adj = 200; }
      else if (t > 0.5) { txt = 'Hızlı artıyor, fazlası yağa gider. Günlük kaloriyi 200 azalt.'; adj = -200; }
      else { txt = 'Haftada 0,1–0,5 kg artış tam hedefte. Böyle devam.'; }
    } else if (g === 'ver') {
      if (t > -0.2) { txt = 'Kilo düşmüyor. Günlük kaloriyi 200 azalt ya da adımını 2.000 artır.'; adj = -200; }
      else if (t < -1) { txt = 'Çok hızlı düşüyor, kas kaybı riski var. Günlük kaloriyi 200 artır.'; adj = 200; }
      else { txt = 'Haftada 0,2–1 kg kayıp tam hedefte. Proteini aksatma.'; }
    } else {
      if (Math.abs(t) < 0.25) { txt = 'Kilon sabit, hedef tutuyor.'; }
      else if (t > 0) { txt = 'Kilon artıyor. Korumak için günlük kaloriyi 200 azalt.'; adj = -200; }
      else { txt = 'Kilon düşüyor. Korumak için günlük kaloriyi 200 artır.'; adj = 200; }
    }
    var recent = profile.kadjAt && dayDiff(today, profile.kadjAt) < 14;
    var btn = '';
    if (adj && recent) { btn = '<p>Hedefi ' + shortDate(profile.kadjAt) + ' tarihinde güncelledin. Etkisini görmek için 2 hafta bekle.</p>'; }
    else if (adj) { btn = '<button type="button" class="mini" data-act="kadj" data-v="' + adj + '">Kalori hedefini ' + (adj > 0 ? '200 artır' : '200 azalt') + '</button>'; }
    return '<aside class="tip' + (adj ? ' warn' : '') + '"><b>Kilo gidişatı · ' + per + '</b><p>' + txt + '</p>' + btn + '</aside>';
  }
  function nutAvgLine() {
    var n = 0, k = 0, p = 0;
    for (var i = 0; i < 7; i++) {
      var d = daily[addDays(today, -i)];
      if (d && d.meals.length) { var t = dayTotals(d); n++; k += t.kcal; p += t.p; }
    }
    return n >= 2 ? '<p class="muted">Son 7 günde kayıt girdiğin ' + n + ' günün ortalaması: ' + Math.round(k / n).toLocaleString('tr-TR') + ' kcal · ' + Math.round(p / n) + ' g protein.</p>' : '';
  }
  function dayTotals(dd) {
    var t = { kcal: 0, p: 0, c: 0, f: 0 };
    if (!dd) { return t; }
    dd.meals.forEach(function (m) { t.kcal += m.kcal * m.q; t.p += m.p * m.q; t.c += m.c * m.q; t.f += m.f * m.q; });
    t.p += dd.prot || 0;
    return t;
  }

  /* figure geometry: right half in (x from centre, y); the left half is mirrored. Shapes are smoothed with Catmull-Rom. */

  /* weekly done/planned sets per muscle (used by the muscle bars and the body map) */

  /* ================= Bugün (landing) and finish screens ================= */

        var adv = adviceFor(e, s, PROGRAM[sel].type === 'leg');
        if (adv && adv.kind === 'up') { toast('Kilo hafif kaldı' + (adv.w !== null ? ', ' + fmt(adv.w) + ' kg’a çık.' : '.'), { ms: 6000 }); }
        else if (adv && adv.kind === 'down') { toast('Kilo ağır geldi' + (adv.w ? ', ' + fmt(adv.w) + ' kg’a düş.' : '.'), { ms: 6000 }); }
      }
      revealNextSet(true);
    }
  }

  /* keep the next unfinished set in view, above the tab bar and the rest bar */
  function revealNextSet(smooth) {
    var go = function () {
      var row = document.querySelector('#day .set:not(.done)');
      if (!row) { return; }
      var r = row.getBoundingClientRect();
      var cap = row.nextElementSibling;
      var bottom = (cap && cap.classList.contains('cap') && !cap.hidden) ? cap.getBoundingClientRect().bottom : r.bottom;
      var tb = document.querySelector('.tabbar');
      var limit = window.innerHeight - (tb ? tb.offsetHeight : 0) - (restEl.hidden ? 0 : restEl.offsetHeight) - 8;
      if (r.top >= 8 && bottom <= limit) { return; }
      var target = window.scrollY + r.top - Math.max(16, Math.min(window.innerHeight * 0.3, limit - (bottom - r.top) - 16));
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: Math.max(0, target), behavior: smooth && !reduce ? 'smooth' : 'auto' });
    };
    if (window.requestAnimationFrame) { requestAnimationFrame(go); } else { go(); }
  }

  /* ================= backup ================= */
  function exportData() {
    var out = { app: 'antrenman-defteri', v: 2, exported: new Date().toISOString(), workouts: {}, daily: {}, profile: profile };
    Object.keys(log).forEach(function (k) { if (log[k].u > 0) { out.workouts[k] = log[k]; } });
    Object.keys(daily).forEach(function (k) { if (daily[k].u > 0) { out.daily[k] = daily[k]; } });
    var text = JSON.stringify(out);
    var name = 'antrenman-yedek-' + today + '.json';
    function fallback() {
      var box = document.getElementById('dump');
      if (box) { box.innerHTML = '<p class="muted">İndirme bu görünümde açık değil. Aşağıdaki metni kopyalayıp bir .json dosyasına yapıştır.</p><textarea class="dump" id="dump-text" readonly></textarea>'; document.getElementById('dump-text').value = text; }
    }
    /* phones: open the share sheet (save to Files, Drive, WhatsApp); elsewhere download the file */
    var file = null;
    try { file = new File([text], name, { type: 'application/json' }); } catch (e) {}
    var touchDev = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    try {
      if (file && touchDev && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'Antrenman Defteri yedeği' }).then(function () { toast('Yedek hazır.'); }, function (err) {
          if (err && err.name === 'AbortError') { return; }
          download();
        });
        return;
      }
    } catch (e) {}
    download();
    function download() {
      try {
        var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
        var a = document.createElement('a');
        a.href = url; a.download = name; a.style.display = 'none';
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
        toast('Yedek indirildi.');
      } catch (e) { fallback(); }
    }
  }
  function importFile(file) {
    var r = new FileReader();
    r.onload = function () {
      var o;
      try { o = JSON.parse(String(r.result)); } catch (e) { toast('Dosya okunamadı. Bu uygulamanın yedek dosyasını seç.'); return; }
      if (!o || o.app !== 'antrenman-defteri') { toast('Bu dosya Antrenman Defteri yedeği değil.'); return; }
      var nw = 0, nd = 0;
      Object.keys(o.workouts || {}).forEach(function (k) {
        var src = o.workouts[k]; if (!src || !src.date) { return; }
        var n = normalize(src), key = keyOf(n.date, n.s);
        if (!log[key] || n.u > log[key].u) { log[key] = n; nw++; queueWrite('w', key); }
      });
      Object.keys(o.daily || {}).forEach(function (k) {
        var src = o.daily[k]; if (!src || !src.date) { return; }
        var n = normDaily(src);
        if (!daily[n.date] || n.u > daily[n.date].u) { daily[n.date] = n; nd++; queueWrite('d', n.date); }
      });
      if (o.profile && (+o.profile.u || 0) > profile.u) { profile = normProfile(o.profile); if (o.profile.sex === 'e' || o.profile.sex === 'k') { sexKnown = true; } queueWrite('p', 'p'); }
      saveLocal(); saveDaily(); saveProfile();
      render();
      toast(nw + ' antrenman, ' + nd + ' gün yüklendi.');
    };
    r.readAsText(file);
  }

  /* ================= rest timer ================= */
  var restEl = document.getElementById('rest'), restTime = document.getElementById('rest-time'), restLab = document.getElementById('rest-l');
  var restEnd = 0, restInt = null, restToken = 0, audioCtx = null;
  function primeAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { return; }
      /* 'ambient' mixes with music already playing instead of pausing it (Safari 17+) */
      try { if (navigator.audioSession) { navigator.audioSession.type = 'ambient'; } } catch (e2) {}
      audioCtx = audioCtx || new AC();
      if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    } catch (e) {}
  }
  /* iOS only lets audio start inside a user gesture: unlock it on the first touch, and again if the system suspended it */
  ['pointerdown', 'touchend', 'keydown'].forEach(function (evName) {
    document.addEventListener(evName, function () { if (!audioCtx || audioCtx.state !== 'running') { primeAudio(); } }, { passive: true, capture: true });
  });
  function beep() {
    try {
      if (!audioCtx) { return; }
      var t = audioCtx.currentTime;
      [0, 0.25].forEach(function (off) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; g.gain.value = 0.15;
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t + off); o.stop(t + off + 0.15);
      });
    } catch (e) {}
    haptic([200, 100, 200]);
  }
  /* one SVG stroke drains per start or +15 sn (no seam); the last 10 seconds pulse */
  var RR_C = 2 * Math.PI * 27, rrArc = document.getElementById('rr-arc'), rrWrap = document.getElementById('rest-ring'), restTotal = 0;
  function ringRun() {
    var remain = Math.max(0, restEnd - Date.now()), f = restTotal ? remain / restTotal : 0;
    rrArc.style.transition = 'none';
    rrArc.style.strokeDashoffset = (RR_C * (1 - f)).toFixed(2);
    if (wbReduce()) { return; }
    void rrArc.getBoundingClientRect();
    rrArc.style.transition = 'stroke-dashoffset ' + remain + 'ms linear';
    rrArc.style.strokeDashoffset = RR_C.toFixed(2);
  }
  function tick() {
    var left = Math.ceil((restEnd - Date.now()) / 1000);
    if (left <= 0) { endRest(); return; }
    restTime.textContent = mmss(left);
    rrWrap.classList.toggle('pulse', left <= 10);
    if (wbReduce() && restTotal) { rrArc.style.strokeDashoffset = (RR_C * (1 - Math.max(0, restEnd - Date.now()) / restTotal)).toFixed(2); }
  }
  function startRest(sec) {
    primeAudio();
    restEnd = Date.now() + sec * 1000;
    restToken++;
    restLab.textContent = 'Dinlenme';
    restEl.hidden = false;
    restEl.classList.remove('end');
    restTotal = sec * 1000;
    ringRun();
    setRestH();
    clearInterval(restInt);
    tick();
    restInt = setInterval(tick, 250);
  }
  function endRest() {
    clearInterval(restInt);
    restTime.textContent = '0:00';
    restLab.textContent = 'Sıradaki set';
    rrWrap.classList.remove('pulse');
    restEl.classList.add('end');
    beep();
    var tok = restToken;
    setTimeout(function () { if (tok === restToken) { restEl.hidden = true; setRestH(); } }, 6000);
  }
  document.getElementById('rest-add').addEventListener('click', function () {
    if (restEnd < Date.now()) { restEnd = Date.now(); restTotal = 0; }
    restEnd += 15000;
    restTotal += 15000;
    restToken++;
    restLab.textContent = 'Dinlenme';
    restEl.classList.remove('end');
    ringRun();
    clearInterval(restInt);
    tick();
    restInt = setInterval(tick, 250);
  });
  function stopRest() { clearInterval(restInt); restToken++; restEl.hidden = true; rrWrap.classList.remove('pulse'); setRestH(); }
  function setRestH() { document.documentElement.style.setProperty('--rest-h', restEl.hidden ? '0px' : restEl.offsetHeight + 'px'); }
  document.getElementById('rest-skip').addEventListener('click', stopRest);

  /* ================= screen stays on while training ================= */
  var wakeLock = null, wantAwake = false;
  function keepAwake() {
    wantAwake = true;
    try {
      if (!navigator.wakeLock || wakeLock) { return; }
      navigator.wakeLock.request('screen').then(function (l) {
        wakeLock = l;
        l.addEventListener('release', function () { wakeLock = null; });
      }).catch(function () {});
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') { return; }
    if (refreshDates()) { vd = today; editKey = null; todayMode = null; sel = startSel(); softRender(); }
    if (wantAwake) { keepAwake(); }
  });

  /* ================= account sync ================= */
  function onCloudWorkouts(snap) {
    var changed = false, seen = {}, oldest = '9999';
    snap.docs.forEach(function (d) {
      var data = d.data();
      if (!data || !data.date) { return; }
      var n = normalize(data), key = keyOf(n.date, n.s);
      if (seen[key] === undefined || n.u > seen[key]) { seen[key] = n.u; }
      if (n.date < oldest) { oldest = n.date; }
      var have = log[key];
      if (!have || n.u > have.u) { log[key] = n; changed = true; }
    });
    if (!snap.metadata.fromCache) { setSync('cloud'); }
    if (changed) {
      saveLocal();
      if (tab === 'antrenman' && editing()) { cur = findDoc(PROGRAM[sel].sid); renderWeek(); }
      else { softRender(); }
    }
    if (!onCloudWorkouts.first && !snap.metadata.fromCache) {
      onCloudWorkouts.first = true;
      Object.keys(log).forEach(function (k) {
        var l = log[k];
        if (!l.u) { return; }
        var inWindow = snap.size < 400 || l.date >= oldest;
        if (inWindow && (seen[k] === undefined || l.u > seen[k])) { flush('w', k); }
      });
    }
  }
  function onCloudDaily(snap) {
    var changed = false, seen = {};
    snap.docs.forEach(function (d) {
      var data = d.data();
      if (!data || !data.date) { return; }
      var n = normDaily(data);
      seen[n.date] = n.u;
      if (!daily[n.date] || n.u > daily[n.date].u) { daily[n.date] = n; changed = true; }
    });
    if (changed) { saveDaily(); softRender(); }
    if (!onCloudDaily.first && !snap.metadata.fromCache) {
      onCloudDaily.first = true;
      Object.keys(daily).forEach(function (k) { if (daily[k].u && (seen[k] === undefined || daily[k].u > seen[k])) { flush('d', k); } });
    }
  }
  function onCloudProfile(snap) {
    if (snap.exists) {
      var n = normProfile(snap.data());
      if (n.u > profile.u) { profile = n; saveProfile(); softRender(); return; }
    }
    if (!onCloudProfile.first && !snap.metadata.fromCache) {
      onCloudProfile.first = true;
      var remoteU = snap.exists ? (+snap.data().u || 0) : 0;
      if (profile.u > remoteU) { flush('p', 'p'); }
    }
  }
  function initCloud() {
    if (!window.claude || !window.claude.use) { return; }
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) { return null; }
      return user.id().then(function (id) {
        if (!id) { return; }
        DB = db; UID = id;
        var off = function () { setSync('local'); };
        db.collection('data/users/' + id).orderBy('date', 'desc').limit(400).onSnapshot(onCloudWorkouts, off);
        var pdoc = db.doc('data/users/' + id + '/profile');
        pdoc.onSnapshot(onCloudProfile, off);
        pdoc.collection('daily').orderBy('date', 'desc').limit(400).onSnapshot(onCloudDaily, off);
      });
    }).catch(function () {});
  }

  /* ================= start ================= */
  sel = startSel();
  var h0 = location.hash.slice(1);
  tab = TABS.indexOf(h0) >= 0 ? h0 : 'antrenman';
  render();
  if (tab === 'antrenman') { revealNextSet(false); }
  initCloud();
})();
</script>
<script>
/* Service worker: offline açılış ve otomatik güncelleme. */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  var swReloaded = false, swHadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (swReloaded || !swHadController) { return; }
    swReloaded = true;
    location.reload();
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') { reg.update().catch(function () {}); }
      });
    }).catch(function () {});
  });
}
</script>
